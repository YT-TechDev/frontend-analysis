name: Temporary text-emphasis-position packaging v3

on:
  push:
    branches:
      - feat/css-text-emphasis-position-value-qualification-549
    paths:
      - .github/workflows/temporary-text-emphasis-position-packaging-v3.yml

permissions:
  contents: write

jobs:
  package-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Apply exact v2 candidate transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-text-emphasis-position-packaging-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          raw = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          )
          exec(compile(script, '<v2-exact-apply>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Confirm focused candidate
        run: cargo test -p frontend-analysis-core text_emphasis_position_value_qualification_tests

      - name: Commit exact net candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/temporary-text-emphasis-position-implementation.yml \
            .github/workflows/temporary-text-emphasis-position-packaging-v2.yml \
            .github/workflows/temporary-text-emphasis-position-packaging-v3.yml
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git diff --cached --check
          git commit -m "feat(css): add bounded text-emphasis-position value qualification"

          expected="$(printf '%s\n' \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/text_emphasis_position_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/value_qualification.rs | sort)"
          actual="$(git diff --name-only 6e123de4e44aef868484ca907a031155cb8f9b67 HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check 6e123de4e44aef868484ca907a031155cb8f9b67 HEAD
          git push origin HEAD:feat/css-text-emphasis-position-value-qualification-549
