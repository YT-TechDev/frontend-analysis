name: Rust Bootstrap

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-bootstrap:
    name: Rust workspace validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Record accepted toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          cargo fmt --version
          cargo clippy --version

          rustup show active-toolchain | grep -E '^1\.97\.1-'
          rustc --version | grep -E '^rustc 1\.97\.1([[:space:]]|$)'
          cargo --version | grep -E '^cargo 1\.97\.1([[:space:]]|$)'

      # Bootstrap acceptance only bridges #62 to #55. Issue #57 must remove it;
      # production validation is not final until then and creates no permanent contract.
      - name: Classify accepted workspace state
        id: workspace
        shell: bash
        run: |
          state="$(python3 .github/scripts/validate-rust-workspace-state.py .)"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Validate zero-member metadata
        if: steps.workspace.outputs.state == 'bootstrap'
        shell: bash
        run: |
          cargo metadata --offline --format-version 1 --no-deps |
          python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          package_count = len(metadata["packages"])
          member_count = len(metadata["workspace_members"])

          print(f"packages={package_count}")
          print(f"workspace_members={member_count}")

          if package_count != 0 or member_count != 0:
              raise SystemExit("expected zero packages and zero workspace members")
          '

      - name: Record bootstrap source checks as not applicable
        if: steps.workspace.outputs.state == 'bootstrap'
        shell: bash
        run: |
          echo "Formatting: Not applicable — no target exists"
          echo "Clippy: Not applicable — no target exists"
          echo "Build: Not applicable — no target exists"
          echo "Tests: Not applicable — no target exists"

      - name: Validate production source
        if: steps.workspace.outputs.state == 'production'
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

      - name: Validate locked production metadata
        if: steps.workspace.outputs.state == 'production'
        shell: bash
        run: |
          cargo metadata --offline --format-version 1 --locked |
          python3 -c '
          import json
          import sys
          from pathlib import Path

          metadata = json.load(sys.stdin)
          packages = metadata["packages"]
          members = metadata["workspace_members"]
          expected_manifest = Path("crates/frontend-analysis-core/Cargo.toml").resolve()

          if len(packages) != 1 or len(members) != 1:
              raise SystemExit("expected exactly one package and workspace member")
          package = packages[0]
          if package["id"] != members[0] or package["name"] != "frontend-analysis-core":
              raise SystemExit("unexpected production package identity")
          if Path(package["manifest_path"]).resolve() != expected_manifest:
              raise SystemExit("unexpected production package manifest path")
          if package["dependencies"]:
              raise SystemExit("production package dependencies are not allowed")
          targets = package["targets"]
          if len(targets) != 1 or targets[0]["kind"] != ["lib"]:
              raise SystemExit("expected only the approved library target")
          '

      - name: Verify clean validation result
        shell: bash
        run: |
          if [[ "${{ steps.workspace.outputs.state }}" == "bootstrap" ]]; then
            test ! -e Cargo.lock
            if find . -type f -name '*.rs' -print -quit | grep -q .; then
              echo "Rust source is not allowed in the zero-member bootstrap"
              exit 1
            fi
          fi
          test -z "$(git status --short)"
