name: Overscroll Shorthand Final Transport

on:
  push:
    branches:
      - feat/css-overscroll-behavior-shorthand-value-qualification-532

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt

      - name: Reproduce already-sealed candidate
        shell: bash
        run: |
          sed -i 's/expected=3,/expected=2,/' .github/scripts/overscroll-shorthand-transport.py
          python3 .github/scripts/overscroll-shorthand-transport.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          text = path.read_text()
          old = """            text_decoration_skip_ink_observations,
                      overscroll_behavior_x_observations,
          """
          new = """            text_decoration_skip_ink_observations,
                      overscroll_behavior_observations,
                      overscroll_behavior_x_observations,
          """
          if text.count(old) != 1:
              raise SystemExit(f"tuple-return anchor mismatch: {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --all -- --check
          git diff --check

      - name: Commit exact three-file tree and push isolated ref
        shell: bash
        run: |
          git rm .github/workflows/overscroll-shorthand-transport.yml .github/scripts/overscroll-shorthand-transport.py
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/overscroll_behavior_shorthand_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs

          python3 - <<'PY'
          import subprocess

          expected = {
              "crates/frontend-analysis-core/src/css/value_qualification.rs",
              "crates/frontend-analysis-core/src/css/validation/overscroll_behavior_shorthand_value_qualification_tests.rs",
              "crates/frontend-analysis-core/src/css/validation/mod.rs",
          }
          staged = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          production = {p for p in staged if not p.startswith(".github/")}
          if production != expected:
              raise SystemExit(f"production scope mismatch: {sorted(production)}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(css): add bounded overscroll-behavior shorthand value qualification"
          git push origin HEAD:refs/heads/transport/css-overscroll-shorthand-candidate-532
