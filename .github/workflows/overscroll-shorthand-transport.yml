name: Overscroll Shorthand Candidate Export

on:
  push:
    branches:
      - feat/css-overscroll-behavior-shorthand-value-qualification-532

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install accepted Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt

      - name: Reproduce tested candidate
        shell: bash
        run: |
          sed -i 's/expected=3,/expected=2,/' .github/scripts/overscroll-shorthand-transport.py
          python3 .github/scripts/overscroll-shorthand-transport.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          text = path.read_text()
          old = """            text_decoration_skip_ink_observations,
                      overscroll_behavior_x_observations,
          """
          new = """            text_decoration_skip_ink_observations,
                      overscroll_behavior_observations,
                      overscroll_behavior_x_observations,
          """
          if text.count(old) != 1:
              raise SystemExit(f"tuple-return anchor mismatch: {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          cargo +1.97.1 fmt --all
          cargo +1.97.1 fmt --all -- --check
          git diff --check

      - name: Prepare exact production files
        shell: bash
        run: |
          mkdir -p candidate/crates/frontend-analysis-core/src/css/validation
          cp crates/frontend-analysis-core/src/css/value_qualification.rs \
            candidate/crates/frontend-analysis-core/src/css/value_qualification.rs
          cp crates/frontend-analysis-core/src/css/validation/mod.rs \
            candidate/crates/frontend-analysis-core/src/css/validation/mod.rs
          cp crates/frontend-analysis-core/src/css/validation/overscroll_behavior_shorthand_value_qualification_tests.rs \
            candidate/crates/frontend-analysis-core/src/css/validation/overscroll_behavior_shorthand_value_qualification_tests.rs

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overscroll-shorthand-exact-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 1
