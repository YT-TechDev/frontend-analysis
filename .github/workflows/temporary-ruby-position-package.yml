name: Temporary ruby-position package

on:
  push:
    branches:
      - feat/css-ruby-position-value-qualification-551
    paths:
      - .github/workflows/temporary-ruby-position-package.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Reapply exact validated production transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/temporary-ruby-position-finalize.yml").read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "ruby-position-production-transform", "exec"), {"__name__": "__main__"})
          PY

      - name: Format and verify packaging patch
        run: |
          cargo fmt --all
          git diff --check
          git diff --name-only

      - name: Commit production integration only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git diff --cached --check
          git commit -m "feat(css): integrate bounded ruby-position qualification"
          git push origin HEAD:feat/css-ruby-position-value-qualification-551
