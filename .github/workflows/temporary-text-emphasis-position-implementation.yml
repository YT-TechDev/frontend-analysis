name: Temporary text-emphasis-position implementation

on:
  push:
    branches:
      - feat/css-text-emphasis-position-value-qualification-549
    paths:
      - .github/workflows/temporary-text-emphasis-position-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Apply bounded text-emphasis-position leaf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          source = source_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              "#538/#541/#546).",
              "#538/#541/#546/#549).",
              "module provenance",
          )

          type_anchor = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum CssOverscrollBehaviorXValue"
          type_block = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextEmphasisPositionComponent {
              Over,
              Under,
              Right,
              Left,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssTextEmphasisPositionComponents {
              authored: [CssTextEmphasisPositionComponent; 2],
              count: usize,
          }

          impl CssTextEmphasisPositionComponents {
              pub(crate) fn authored_components(&self) -> &[CssTextEmphasisPositionComponent] {
                  &self.authored[..self.count]
              }
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextEmphasisPositionValue {
              Components(CssTextEmphasisPositionComponents),
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextEmphasisPositionUnsupportedReason {
              CssWideKeyword,
              DeferredSubstitutionFunction,
              WholeValueFunction,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextEmphasisPositionQualificationOutcome {
              Qualified(CssTextEmphasisPositionValue),
              InvalidForSelectedValueGrammar,
              UnsupportedBySelectedValueProfile(CssTextEmphasisPositionUnsupportedReason),
          }

          /// One selected ordinary declaration's bounded authored
          /// `text-emphasis-position` qualification.
          ///
          /// The selected normative grammar is
          /// `[ over | under ] && [ right | left ]?`: one vertical component is
          /// required, the side component is optional, and the two groups may occur
          /// in either authored order. Exact authored sequence is retained. This
          /// slice does not synthesize the default `right`, canonicalize CSSOM
          /// serialization, implement language-dependent placement, or claim
          /// computed/used-value or rendering semantics.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssTextEmphasisPositionQualificationObservation {
              occurrence_index: usize,
              placement: CssDeclarationPlacement,
              outcome: CssTextEmphasisPositionQualificationOutcome,
          }

          impl CssTextEmphasisPositionQualificationObservation {
              pub(crate) const fn occurrence_index(&self) -> usize {
                  self.occurrence_index
              }

              pub(crate) const fn placement(&self) -> CssDeclarationPlacement {
                  self.placement
              }

              pub(crate) const fn outcome(&self) -> CssTextEmphasisPositionQualificationOutcome {
                  self.outcome
              }
          }

          '''
          source = replace_once(source, type_anchor, type_block + type_anchor, "type insertion")

          field_anchor = "    text_transform_observations: Vec<CssTextTransformQualificationObservation>,\n"
          source = replace_once(
              source,
              field_anchor,
              field_anchor
              + "    text_emphasis_position_observations: Vec<CssTextEmphasisPositionQualificationObservation>,\n",
              "run-result field",
          )

          getter_anchor = "    pub(crate) fn overscroll_behavior_x_observations(\n"
          getter = '''    pub(crate) fn text_emphasis_position_observations(
              &self,
          ) -> &[CssTextEmphasisPositionQualificationObservation] {
              &self.text_emphasis_position_observations
          }

          '''
          source = replace_once(source, getter_anchor, getter + getter_anchor, "getter insertion")

          mut_anchor = "        let mut text_transform_observations = Vec::new();\n"
          source = replace_once(
              source,
              mut_anchor,
              mut_anchor + "        let mut text_emphasis_position_observations = Vec::new();\n",
              "mutable collection",
          )

          for indent, expected in (("        ", 2), ("            ", 1)):
              old = (
                  f"{indent}text_transform_observations,\n"
                  f"{indent}overscroll_behavior_x_observations,"
              )
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"tuple/constructor adjacency at indent {len(indent)}: "
                      f"expected {expected}, found {count}"
                  )
              new = (
                  f"{indent}text_transform_observations,\n"
                  f"{indent}text_emphasis_position_observations,\n"
                  f"{indent}overscroll_behavior_x_observations,"
              )
              source = source.replace(old, new)

          dispatch_anchor = '            if property_name.eq_ignore_ascii_case("overscroll-behavior-x") {\n'
          dispatch = '''            if property_name.eq_ignore_ascii_case("text-emphasis-position") {
              let value_range = cursor.window_for(occurrence.value())?;
              let value_items = &tokenizer_result.lexical_items()[value_range];
              text_emphasis_position_observations.push(
                  CssTextEmphasisPositionQualificationObservation {
                      occurrence_index,
                      placement: occurrence.placement(),
                      outcome: qualify_text_emphasis_position_value(value_items),
                  },
              );
              continue;
          }

          '''
          source = replace_once(source, dispatch_anchor, dispatch + dispatch_anchor, "dispatch insertion")

          qualifier_anchor = "fn qualify_overscroll_behavior_value(\n"
          qualifier = '''fn qualify_text_emphasis_position_value(
              items: &[CssLexicalItem],
          ) -> CssTextEmphasisPositionQualificationOutcome {
              if contains_deferred_substitution_function(items) {
                  return CssTextEmphasisPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssTextEmphasisPositionUnsupportedReason::DeferredSubstitutionFunction,
                  );
              }

              if is_entire_whole_value_function(items) {
                  return CssTextEmphasisPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssTextEmphasisPositionUnsupportedReason::WholeValueFunction,
                  );
              }

              let tokens: Vec<_> = items
                  .iter()
                  .filter_map(|item| match item {
                      CssLexicalItem::SemanticToken(token)
                          if !matches!(token.kind(), CssTokenKind::Whitespace) =>
                      {
                          Some(token)
                      }
                      _ => None,
                  })
                  .collect();

              if let [token] = tokens.as_slice()
                  && let CssTokenKind::Ident(identifier) = token.kind()
                  && is_css_wide_keyword(identifier)
              {
                  return CssTextEmphasisPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssTextEmphasisPositionUnsupportedReason::CssWideKeyword,
                  );
              }

              if tokens.is_empty() || tokens.len() > 2 {
                  return CssTextEmphasisPositionQualificationOutcome::InvalidForSelectedValueGrammar;
              }

              let mut authored = [CssTextEmphasisPositionComponent::Over; 2];
              let mut count = 0usize;
              let mut occupied_slots = 0u8;

              for token in tokens {
                  let CssTokenKind::Ident(identifier) = token.kind() else {
                      return CssTextEmphasisPositionQualificationOutcome::InvalidForSelectedValueGrammar;
                  };
                  let Some((component, slot)) = text_emphasis_position_component(identifier) else {
                      return CssTextEmphasisPositionQualificationOutcome::InvalidForSelectedValueGrammar;
                  };
                  if occupied_slots & slot != 0 {
                      return CssTextEmphasisPositionQualificationOutcome::InvalidForSelectedValueGrammar;
                  }
                  occupied_slots |= slot;
                  authored[count] = component;
                  count += 1;
              }

              const VERTICAL_SLOT: u8 = 0b01;
              if occupied_slots & VERTICAL_SLOT == 0 {
                  return CssTextEmphasisPositionQualificationOutcome::InvalidForSelectedValueGrammar;
              }

              CssTextEmphasisPositionQualificationOutcome::Qualified(
                  CssTextEmphasisPositionValue::Components(CssTextEmphasisPositionComponents {
                      authored,
                      count,
                  }),
              )
          }

          fn text_emphasis_position_component(
              identifier: &str,
          ) -> Option<(CssTextEmphasisPositionComponent, u8)> {
              if identifier.eq_ignore_ascii_case("over") {
                  return Some((CssTextEmphasisPositionComponent::Over, 0b01));
              }
              if identifier.eq_ignore_ascii_case("under") {
                  return Some((CssTextEmphasisPositionComponent::Under, 0b01));
              }
              if identifier.eq_ignore_ascii_case("right") {
                  return Some((CssTextEmphasisPositionComponent::Right, 0b10));
              }
              if identifier.eq_ignore_ascii_case("left") {
                  return Some((CssTextEmphasisPositionComponent::Left, 0b10));
              }
              None
          }

          '''
          source = replace_once(
              source,
              qualifier_anchor,
              qualifier + qualifier_anchor,
              "qualifier insertion",
          )

          source_path.write_text(source)

          mod_path = Path("crates/frontend-analysis-core/src/css/validation/mod.rs")
          mod_text = mod_path.read_text()
          mod_anchor = "#[cfg(test)]\nmod text_rendering_value_qualification_tests;\n"
          mod_insert = "#[cfg(test)]\nmod text_emphasis_position_value_qualification_tests;\n"
          mod_text = replace_once(
              mod_text,
              mod_anchor,
              mod_insert + mod_anchor,
              "test module registration",
          )
          mod_path.write_text(mod_text)
          PY

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Run focused text-emphasis-position tests
        run: cargo test -p frontend-analysis-core text_emphasis_position_value_qualification_tests

      - name: Run Core Clippy
        run: cargo clippy -p frontend-analysis-core --all-targets -- -D warnings

      - name: Run Core full suite
        run: cargo test -p frontend-analysis-core

      - name: Commit sealed candidate and remove transport workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-text-emphasis-position-implementation.yml
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/text_emphasis_position_value_qualification_tests.rs
          git diff --cached --check
          expected="$(printf '%s\n' \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/text_emphasis_position_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/value_qualification.rs | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git commit -m "feat(css): add bounded text-emphasis-position value qualification"
          git push origin HEAD:feat/css-text-emphasis-position-value-qualification-549
