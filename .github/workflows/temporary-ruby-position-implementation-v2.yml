name: Temporary ruby-position implementation v2

on:
  push:
    branches:
      - feat/css-ruby-position-value-qualification-551
    paths:
      - .github/workflows/temporary-ruby-position-implementation-v2.yml

permissions:
  contents: write

jobs:
  implement-and-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Apply bounded ruby-position leaf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          source = source_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}")
              return text.replace(old, new)

          source = replace_once(
              source,
              "#541/#546/#549).",
              "#541/#546/#549/#551).",
              "module provenance",
          )

          type_anchor = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum CssRubyOverhangValue"
          type_block = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssRubyPositionComponent {
              Alternate,
              Over,
              Under,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssRubyPositionComponents {
              authored: [CssRubyPositionComponent; 2],
              count: usize,
          }

          impl CssRubyPositionComponents {
              pub(crate) fn authored_components(&self) -> &[CssRubyPositionComponent] {
                  &self.authored[..self.count]
              }
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssRubyPositionValue {
              InterCharacter,
              Components(CssRubyPositionComponents),
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssRubyPositionUnsupportedReason {
              CssWideKeyword,
              DeferredSubstitutionFunction,
              WholeValueFunction,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssRubyPositionQualificationOutcome {
              Qualified(CssRubyPositionValue),
              InvalidForSelectedValueGrammar,
              UnsupportedBySelectedValueProfile(CssRubyPositionUnsupportedReason),
          }

          /// One selected ordinary declaration's bounded authored
          /// `ruby-position` qualification.
          ///
          /// The composite branch preserves exact authored order for the
          /// property-specific `[ alternate || [ over | under ] ]` grammar.
          /// `alternate` occupies one singleton slot while `over | under` share
          /// one mutually-exclusive SIDE slot. `inter-character` remains a
          /// standalone authored identity. This slice does not execute alternating
          /// annotation-level placement, inter-character layout, writing-mode
          /// resolution, CSSOM canonicalization, or computed/used-value semantics.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssRubyPositionQualificationObservation {
              occurrence_index: usize,
              placement: CssDeclarationPlacement,
              outcome: CssRubyPositionQualificationOutcome,
          }

          impl CssRubyPositionQualificationObservation {
              pub(crate) const fn occurrence_index(&self) -> usize {
                  self.occurrence_index
              }

              pub(crate) const fn placement(&self) -> CssDeclarationPlacement {
                  self.placement
              }

              pub(crate) const fn outcome(&self) -> CssRubyPositionQualificationOutcome {
                  self.outcome
              }
          }

          '''
          source = replace_once(source, type_anchor, type_block + type_anchor, "type insertion")

          source = replace_once(
              source,
              "    ruby_merge_observations: Vec<CssRubyMergeQualificationObservation>,\n    ruby_overhang_observations: Vec<CssRubyOverhangQualificationObservation>,",
              "    ruby_merge_observations: Vec<CssRubyMergeQualificationObservation>,\n    ruby_position_observations: Vec<CssRubyPositionQualificationObservation>,\n    ruby_overhang_observations: Vec<CssRubyOverhangQualificationObservation>,",
              "run-result field",
          )

          getter_anchor = "    pub(crate) fn ruby_overhang_observations(&self) -> &[CssRubyOverhangQualificationObservation] {\n"
          getter = '''    pub(crate) fn ruby_position_observations(&self) -> &[CssRubyPositionQualificationObservation] {
              &self.ruby_position_observations
          }

          '''
          source = replace_once(source, getter_anchor, getter + getter_anchor, "getter insertion")

          source = replace_once(
              source,
              "        let mut ruby_merge_observations = Vec::new();\n        let mut ruby_overhang_observations = Vec::new();",
              "        let mut ruby_merge_observations = Vec::new();\n        let mut ruby_position_observations = Vec::new();\n        let mut ruby_overhang_observations = Vec::new();",
              "mutable collection",
          )

          pair_anchor = "        ruby_merge_observations,\n        ruby_overhang_observations,"
          source = replace_exact(
              source,
              pair_anchor,
              "        ruby_merge_observations,\n        ruby_position_observations,\n        ruby_overhang_observations,",
              2,
              "tuple and constructor fields",
          )

          dispatch_anchor = '            if property_name.eq_ignore_ascii_case("ruby-overhang") {\n'
          dispatch = '''            if property_name.eq_ignore_ascii_case("ruby-position") {
              let value_range = cursor.window_for(occurrence.value())?;
              let value_items = &tokenizer_result.lexical_items()[value_range];
              ruby_position_observations.push(CssRubyPositionQualificationObservation {
                  occurrence_index,
                  placement: occurrence.placement(),
                  outcome: qualify_ruby_position_value(value_items),
              });
              continue;
          }

          '''
          source = replace_once(source, dispatch_anchor, dispatch + dispatch_anchor, "dispatch insertion")

          qualifier_anchor = "fn qualify_ruby_overhang_value(items: &[CssLexicalItem]) -> CssRubyOverhangQualificationOutcome {\n"
          qualifier = '''fn qualify_ruby_position_value(
              items: &[CssLexicalItem],
          ) -> CssRubyPositionQualificationOutcome {
              if contains_deferred_substitution_function(items) {
                  return CssRubyPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssRubyPositionUnsupportedReason::DeferredSubstitutionFunction,
                  );
              }

              if is_entire_whole_value_function(items) {
                  return CssRubyPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssRubyPositionUnsupportedReason::WholeValueFunction,
                  );
              }

              let tokens: Vec<_> = items
                  .iter()
                  .filter_map(|item| match item {
                      CssLexicalItem::SemanticToken(token)
                          if !matches!(token.kind(), CssTokenKind::Whitespace) =>
                      {
                          Some(token)
                      }
                      _ => None,
                  })
                  .collect();

              if let [token] = tokens.as_slice()
                  && let CssTokenKind::Ident(identifier) = token.kind()
              {
                  if is_css_wide_keyword(identifier) {
                      return CssRubyPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                          CssRubyPositionUnsupportedReason::CssWideKeyword,
                      );
                  }
                  if identifier.eq_ignore_ascii_case("inter-character") {
                      return CssRubyPositionQualificationOutcome::Qualified(
                          CssRubyPositionValue::InterCharacter,
                      );
                  }
              }

              if tokens.is_empty() || tokens.len() > 2 {
                  return CssRubyPositionQualificationOutcome::InvalidForSelectedValueGrammar;
              }

              let mut authored = [CssRubyPositionComponent::Alternate; 2];
              let mut count = 0usize;
              let mut occupied_slots = 0u8;

              for token in tokens {
                  let CssTokenKind::Ident(identifier) = token.kind() else {
                      return CssRubyPositionQualificationOutcome::InvalidForSelectedValueGrammar;
                  };
                  let Some((component, slot)) = ruby_position_component(identifier) else {
                      return CssRubyPositionQualificationOutcome::InvalidForSelectedValueGrammar;
                  };
                  if occupied_slots & slot != 0 {
                      return CssRubyPositionQualificationOutcome::InvalidForSelectedValueGrammar;
                  }
                  occupied_slots |= slot;
                  authored[count] = component;
                  count += 1;
              }

              CssRubyPositionQualificationOutcome::Qualified(CssRubyPositionValue::Components(
                  CssRubyPositionComponents { authored, count },
              ))
          }

          fn ruby_position_component(identifier: &str) -> Option<(CssRubyPositionComponent, u8)> {
              if identifier.eq_ignore_ascii_case("alternate") {
                  return Some((CssRubyPositionComponent::Alternate, 0b01));
              }
              if identifier.eq_ignore_ascii_case("over") {
                  return Some((CssRubyPositionComponent::Over, 0b10));
              }
              if identifier.eq_ignore_ascii_case("under") {
                  return Some((CssRubyPositionComponent::Under, 0b10));
              }
              None
          }

          '''
          source = replace_once(source, qualifier_anchor, qualifier + qualifier_anchor, "qualifier insertion")
          source_path.write_text(source)

          mod_path = Path("crates/frontend-analysis-core/src/css/validation/mod.rs")
          mod_text = mod_path.read_text()
          mod_text = replace_once(
              mod_text,
              "#[cfg(test)]\nmod ruby_merge_value_qualification_tests;\n#[cfg(test)]\nmod ruby_overhang_value_qualification_tests;",
              "#[cfg(test)]\nmod ruby_merge_value_qualification_tests;\n#[cfg(test)]\nmod ruby_position_value_qualification_tests;\n#[cfg(test)]\nmod ruby_overhang_value_qualification_tests;",
              "test module registration",
          )
          mod_path.write_text(mod_text)
          PY

          cat > crates/frontend-analysis-core/src/css/validation/ruby_position_value_qualification_tests.rs <<'RS'
          use crate::css::analysis::analyze_css_source;
          use crate::css::parser::resource::CssParserLimits;
          use crate::css::parser::result::CssParserExecutionCompletion;
          use crate::css::tokenizer::resource::CssTokenizerLimits;
          use crate::css::value_qualification::{
              CssRubyPositionComponent, CssRubyPositionQualificationOutcome,
              CssRubyPositionUnsupportedReason, CssRubyPositionValue, CssValueQualificationRunResult,
              run,
          };
          use crate::{SourceId, SourceText};

          #[derive(Debug, Clone, Copy)]
          enum ExpectedOutcome {
              Components(&'static [CssRubyPositionComponent]),
              InterCharacter,
              Invalid,
              UnsupportedCssWide,
              UnsupportedDeferred,
              UnsupportedWholeValue,
          }

          fn tokenizer_limits() -> CssTokenizerLimits {
              CssTokenizerLimits::new(4096, 100_000, 8192, 1024, 8192, 8192).unwrap()
          }

          fn parser_limits() -> CssParserLimits {
              parser_limits_with_occurrences(8192)
          }

          fn parser_limits_with_occurrences(max_declaration_occurrences: usize) -> CssParserLimits {
              CssParserLimits::new(
                  100_000,
                  256,
                  256,
                  max_declaration_occurrences,
                  1024,
                  1024,
                  1024,
                  1024,
                  8192,
              )
              .unwrap()
          }

          fn qualify(source_id: u64, css: &str) -> CssValueQualificationRunResult {
              qualify_with_limits(source_id, css, parser_limits())
          }

          fn qualify_with_limits(
              source_id: u64,
              css: &str,
              parser_limits: CssParserLimits,
          ) -> CssValueQualificationRunResult {
              let source = SourceText::new(SourceId::new(source_id), css.to_owned());
              let parser_result = analyze_css_source(&source, tokenizer_limits(), parser_limits).unwrap();
              run(parser_result).unwrap()
          }

          fn assert_expected(result: &CssValueQualificationRunResult, expected: &[ExpectedOutcome]) {
              assert_eq!(result.ruby_position_observations().len(), expected.len());
              for (observation, expected) in result.ruby_position_observations().iter().zip(expected) {
                  match (observation.outcome(), expected) {
                      (
                          CssRubyPositionQualificationOutcome::Qualified(
                              CssRubyPositionValue::Components(actual),
                          ),
                          ExpectedOutcome::Components(expected),
                      ) => assert_eq!(actual.authored_components(), *expected),
                      (
                          CssRubyPositionQualificationOutcome::Qualified(
                              CssRubyPositionValue::InterCharacter,
                          ),
                          ExpectedOutcome::InterCharacter,
                      ) => {}
                      (
                          CssRubyPositionQualificationOutcome::InvalidForSelectedValueGrammar,
                          ExpectedOutcome::Invalid,
                      ) => {}
                      (
                          CssRubyPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                              CssRubyPositionUnsupportedReason::CssWideKeyword,
                          ),
                          ExpectedOutcome::UnsupportedCssWide,
                      ) => {}
                      (
                          CssRubyPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                              CssRubyPositionUnsupportedReason::DeferredSubstitutionFunction,
                          ),
                          ExpectedOutcome::UnsupportedDeferred,
                      ) => {}
                      (
                          CssRubyPositionQualificationOutcome::UnsupportedBySelectedValueProfile(
                              CssRubyPositionUnsupportedReason::WholeValueFunction,
                          ),
                          ExpectedOutcome::UnsupportedWholeValue,
                      ) => {}
                      (actual, expected) => panic!("unexpected outcome: {actual:?}, expected {expected:?}"),
                  }
              }
          }

          const ALT: &[CssRubyPositionComponent] = &[CssRubyPositionComponent::Alternate];
          const OVER: &[CssRubyPositionComponent] = &[CssRubyPositionComponent::Over];
          const UNDER: &[CssRubyPositionComponent] = &[CssRubyPositionComponent::Under];
          const ALT_OVER: &[CssRubyPositionComponent] = &[
              CssRubyPositionComponent::Alternate,
              CssRubyPositionComponent::Over,
          ];
          const OVER_ALT: &[CssRubyPositionComponent] = &[
              CssRubyPositionComponent::Over,
              CssRubyPositionComponent::Alternate,
          ];
          const ALT_UNDER: &[CssRubyPositionComponent] = &[
              CssRubyPositionComponent::Alternate,
              CssRubyPositionComponent::Under,
          ];
          const UNDER_ALT: &[CssRubyPositionComponent] = &[
              CssRubyPositionComponent::Under,
              CssRubyPositionComponent::Alternate,
          ];

          #[test]
          fn normative_direct_grammar_preserves_authored_order_and_rejects_stale_wpt_auto() {
              let result = qualify(
                  3180,
                  concat!(
                      "a{ruby-position:alternate;}",
                      "b{ruby-position:over;}",
                      "c{ruby-position:under;}",
                      "d{ruby-position:alternate over;}",
                      "e{ruby-position:over alternate;}",
                      "f{ruby-position:alternate under;}",
                      "g{ruby-position:under alternate;}",
                      "h{ruby-position:inter-character;}",
                      "i{ruby-position:auto;}",
                      "j{ruby-position:center;}",
                  ),
              );
              assert_expected(
                  &result,
                  &[
                      ExpectedOutcome::Components(ALT),
                      ExpectedOutcome::Components(OVER),
                      ExpectedOutcome::Components(UNDER),
                      ExpectedOutcome::Components(ALT_OVER),
                      ExpectedOutcome::Components(OVER_ALT),
                      ExpectedOutcome::Components(ALT_UNDER),
                      ExpectedOutcome::Components(UNDER_ALT),
                      ExpectedOutcome::InterCharacter,
                      ExpectedOutcome::Invalid,
                      ExpectedOutcome::Invalid,
                  ],
              );
              assert_eq!(result.execution_completion(), CssParserExecutionCompletion::Complete);
          }

          #[test]
          fn slot_collisions_and_standalone_mixing_are_invalid() {
              let result = qualify(
                  3181,
                  concat!(
                      "a{ruby-position:alternate alternate;}",
                      "b{ruby-position:over under;}",
                      "c{ruby-position:under over;}",
                      "d{ruby-position:inter-character alternate;}",
                      "e{ruby-position:over inter-character;}",
                      "f{ruby-position:alternate over under;}",
                      "g{ruby-position:;}",
                      "h{ruby-position:10px;}",
                  ),
              );
              assert_expected(&result, &[ExpectedOutcome::Invalid; 8]);
          }

          #[test]
          fn case_escapes_comments_and_priority_preserve_decoded_authored_components() {
              let result = qualify(
                  3182,
                  concat!(
                      "a{RUBY-POSITION:AlTeRnAtE OvEr;}",
                      r"b{ruby-position:\61 lternate under;}",
                      r"c{ruby-\70 osition:over alternate;}",
                      "d{ruby-position:/**/inter-character/**/!important;}",
                  ),
              );
              assert_expected(
                  &result,
                  &[
                      ExpectedOutcome::Components(ALT_OVER),
                      ExpectedOutcome::Components(ALT_UNDER),
                      ExpectedOutcome::Components(OVER_ALT),
                      ExpectedOutcome::InterCharacter,
                  ],
              );
              assert!(result.upstream_parser_result().occurrences()[3].priority().is_some());
          }

          #[test]
          fn css_wide_deferred_and_whole_value_boundaries_fail_open_without_upgrading_mixed_functions() {
              let result = qualify(
                  3183,
                  concat!(
                      "a{ruby-position:initial;}",
                      "b{ruby-position:inherit;}",
                      "c{ruby-position:revert-layer;}",
                      "d{ruby-position:var(--p);}",
                      "e{ruby-position:alternate var(--p);}",
                      "f{ruby-position:--position();}",
                      "g{ruby-position:first-valid(over,under);}",
                      "h{ruby-position:cycle(over,under);}",
                      "i{ruby-position:interpolate(0%,0:over,1:under);}",
                      "j{ruby-position:alternate first-valid(over);}",
                      "k{ruby-position:foo();}",
                      "l{ruby-position:calc(1);}",
                  ),
              );
              assert_expected(
                  &result,
                  &[
                      ExpectedOutcome::UnsupportedCssWide,
                      ExpectedOutcome::UnsupportedCssWide,
                      ExpectedOutcome::UnsupportedCssWide,
                      ExpectedOutcome::UnsupportedDeferred,
                      ExpectedOutcome::UnsupportedDeferred,
                      ExpectedOutcome::UnsupportedDeferred,
                      ExpectedOutcome::UnsupportedWholeValue,
                      ExpectedOutcome::UnsupportedWholeValue,
                      ExpectedOutcome::UnsupportedWholeValue,
                      ExpectedOutcome::Invalid,
                      ExpectedOutcome::Invalid,
                      ExpectedOutcome::Invalid,
                  ],
              );
          }

          #[test]
          fn applicability_is_not_an_input_and_accepted_sibling_leaves_remain_distinct() {
              let result = qualify(
                  3184,
                  concat!(
                      "ruby{ruby-position:alternate over;}",
                      "div{ruby-position:alternate over;}",
                      "svg{ruby-position:alternate over;}",
                      "a{ruby-merge:merge;}",
                      "b{ruby-overhang:spaces;}",
                      "c{contain:size layout;}",
                      "d{text-transform:uppercase full-width;}",
                      "e{text-emphasis-position:over left;}",
                  ),
              );
              assert_expected(
                  &result,
                  &[
                      ExpectedOutcome::Components(ALT_OVER),
                      ExpectedOutcome::Components(ALT_OVER),
                      ExpectedOutcome::Components(ALT_OVER),
                  ],
              );
              assert_eq!(result.ruby_merge_observations().len(), 1);
              assert_eq!(result.ruby_overhang_observations().len(), 1);
              assert_eq!(result.contain_observations().len(), 1);
              assert_eq!(result.text_transform_observations().len(), 1);
              assert_eq!(result.text_emphasis_position_observations().len(), 1);
          }

          #[test]
          fn duplicate_declarations_keep_distinct_run_local_placement() {
              let result = qualify(3185, "a{ruby-position:over;}b{ruby-position:over;}");
              assert_expected(
                  &result,
                  &[ExpectedOutcome::Components(OVER), ExpectedOutcome::Components(OVER)],
              );
              assert_eq!(result.ruby_position_observations()[0].occurrence_index(), 0);
              assert_eq!(result.ruby_position_observations()[1].occurrence_index(), 1);
              assert_ne!(
                  result.ruby_position_observations()[0].placement().context_id(),
                  result.ruby_position_observations()[1].placement().context_id(),
              );
          }

          #[test]
          fn nonordinary_declaration_shaped_contexts_are_excluded() {
              for (source_id, css) in [
                  (3186, "@font-face{ruby-position:over;}"),
                  (3187, "@page{ruby-position:over;}"),
              ] {
                  let result = qualify(source_id, css);
                  assert!(result.ruby_position_observations().is_empty());
              }
          }

          #[test]
          fn parser_resource_stop_preserves_committed_prefix() {
              let result = qualify_with_limits(
                  3188,
                  "a{ruby-position:alternate;}b{ruby-position:under;}",
                  parser_limits_with_occurrences(1),
              );
              assert_expected(&result, &[ExpectedOutcome::Components(ALT)]);
              assert_ne!(result.execution_completion(), CssParserExecutionCompletion::Complete);
          }

          #[test]
          fn repeated_and_cross_source_runs_are_semantically_deterministic() {
              let css = "a{ruby-position:under alternate;}b{ruby-position:inter-character;}";
              let first = qualify(3189, css);
              let second = qualify(3189, css);
              let other_source = qualify(3190, css);
              let expected = [
                  ExpectedOutcome::Components(UNDER_ALT),
                  ExpectedOutcome::InterCharacter,
              ];
              assert_expected(&first, &expected);
              assert_expected(&second, &expected);
              assert_expected(&other_source, &expected);
          }
          RS

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Run focused ruby-position tests
        run: cargo test -p frontend-analysis-core ruby_position_value_qualification_tests

      - name: Run Core Clippy
        run: cargo clippy -p frontend-analysis-core --all-targets --all-features -- -D warnings

      - name: Run Core full suite
        run: cargo test -p frontend-analysis-core

      - name: Commit sealed candidate and remove transport workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/temporary-ruby-position-implementation.yml \
            .github/workflows/temporary-ruby-position-implementation-v2.yml
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/ruby_position_value_qualification_tests.rs
          git diff --cached --check
          git commit -m "feat(css): add bounded ruby-position value qualification"
          git push origin HEAD:feat/css-ruby-position-value-qualification-551
