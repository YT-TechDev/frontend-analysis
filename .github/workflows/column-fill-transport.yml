name: Column Fill Implementation Transport

on:
  push:
    branches:
      - feat/css-column-fill-value-qualification-520
    paths:
      - .github/workflows/column-fill-transport.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/css-column-fill-value-qualification-520
          fetch-depth: 0

      - name: Patch bounded column-fill leaf
        shell: bash
        run: |
          sed -i 's/    count=3,/    count=2,/' .github/scripts/column-fill-transport.py
          python3 .github/scripts/column-fill-transport.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          text = path.read_text()
          old = "            fill_rule_observations,\n            word_spacing_observations,"
          new = "            fill_rule_observations,\n            column_fill_observations,\n            word_spacing_observations,"
          if text.count(old) != 1:
              raise SystemExit(f"expected one inner tuple anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Format and validate scope
        shell: bash
        run: |
          cargo +1.97.1 fmt --all
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/column-fill-transport.yml",
              ".github/scripts/column-fill-transport.py",
              "crates/frontend-analysis-core/src/css/value_qualification.rs",
              "crates/frontend-analysis-core/src/css/validation/column_fill_value_qualification_tests.rs",
              "crates/frontend-analysis-core/src/css/validation/mod.rs",
          }
          output = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          paths = {line[3:] for line in output}
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          required = {
              "crates/frontend-analysis-core/src/css/value_qualification.rs",
              "crates/frontend-analysis-core/src/css/validation/column_fill_value_qualification_tests.rs",
              "crates/frontend-analysis-core/src/css/validation/mod.rs",
          }
          if not required <= paths:
              raise SystemExit(f"missing expected changed paths: {sorted(required - paths)}")
          PY

      - name: Implementation-side sealing
        shell: bash
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 test -p frontend-analysis-core column_fill_value_qualification_tests
          cargo +1.97.1 clippy -p frontend-analysis-core --all-targets --all-features -- -D warnings
          cargo +1.97.1 test -p frontend-analysis-core

      - name: Commit final three-file candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/column-fill-transport.yml .github/scripts/column-fill-transport.py
          python3 - <<'PY'
          import subprocess
          expected = {
              "crates/frontend-analysis-core/src/css/value_qualification.rs",
              "crates/frontend-analysis-core/src/css/validation/column_fill_value_qualification_tests.rs",
              "crates/frontend-analysis-core/src/css/validation/mod.rs",
          }
          output = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          paths = {line[3:] for line in output if not line[3:].startswith(".github/")}
          if paths != expected:
              raise SystemExit(f"final candidate scope mismatch: {sorted(paths)}")
          PY
          git add crates/frontend-analysis-core/src/css/value_qualification.rs \
                  crates/frontend-analysis-core/src/css/validation/column_fill_value_qualification_tests.rs \
                  crates/frontend-analysis-core/src/css/validation/mod.rs
          git commit -m "feat(css): add bounded column-fill value qualification"
          git push origin HEAD:feat/css-column-fill-value-qualification-520
