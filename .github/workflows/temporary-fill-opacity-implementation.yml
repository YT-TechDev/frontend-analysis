name: Temporary fill-opacity implementation

on:
  push:
    branches:
      - feat/css-fill-opacity-value-qualification

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Apply bounded fill-opacity leaf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/frontend-analysis-core/src/css/value_qualification.rs')
          text = path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          once(
              '#549/#551/#553).',
              '#549/#551/#553/#555).',
              'leaf header',
          )

          shape_marker = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssShapeImageThresholdValue {'''.replace('          ', '')
          fill_types = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssFillOpacityValue {
              DirectNumberLiteral,
              DirectPercentageLiteral,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssFillOpacityUnsupportedReason {
              CssWideKeyword,
              DeferredSubstitutionFunction,
              WholeValueFunction,
              FunctionValue,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssFillOpacityQualificationOutcome {
              Qualified(CssFillOpacityValue),
              InvalidForSelectedValueGrammar,
              UnsupportedBySelectedValueProfile(CssFillOpacityUnsupportedReason),
          }

          /// One selected ordinary declaration's bounded `fill-opacity` qualification.
          ///
          /// This profile reuses the accepted direct authored `<opacity-value>`
          /// Number/Percentage boundary. Out-of-range authored values remain qualified;
          /// clamping, SVG painting/applicability, CSSOM, animation, and computed/used
          /// values remain outside this slice.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssFillOpacityQualificationObservation {
              occurrence_index: usize,
              placement: CssDeclarationPlacement,
              outcome: CssFillOpacityQualificationOutcome,
          }

          impl CssFillOpacityQualificationObservation {
              pub(crate) const fn occurrence_index(&self) -> usize {
                  self.occurrence_index
              }

              pub(crate) const fn placement(&self) -> CssDeclarationPlacement {
                  self.placement
              }

              pub(crate) const fn outcome(&self) -> CssFillOpacityQualificationOutcome {
                  self.outcome
              }
          }

          '''.replace('          ', '')
          once(shape_marker, fill_types + shape_marker, 'fill-opacity types')

          once(
              '    opacity_observations: Vec<CssOpacityQualificationObservation>,\n    shape_image_threshold_observations: Vec<CssShapeImageThresholdQualificationObservation>,',
              '    opacity_observations: Vec<CssOpacityQualificationObservation>,\n    fill_opacity_observations: Vec<CssFillOpacityQualificationObservation>,\n    shape_image_threshold_observations: Vec<CssShapeImageThresholdQualificationObservation>,',
              'run-result field',
          )

          once(
              '''    pub(crate) fn opacity_observations(&self) -> &[CssOpacityQualificationObservation] {
                  &self.opacity_observations
              }

              pub(crate) fn shape_image_threshold_observations('''.replace('              ', ''),
              '''    pub(crate) fn opacity_observations(&self) -> &[CssOpacityQualificationObservation] {
                  &self.opacity_observations
              }

              pub(crate) fn fill_opacity_observations(&self) -> &[CssFillOpacityQualificationObservation] {
                  &self.fill_opacity_observations
              }

              pub(crate) fn shape_image_threshold_observations('''.replace('              ', ''),
              'run-result getter',
          )

          text, count = re.subn(
              r'(?m)^(\s*)opacity_observations,\n\1shape_image_threshold_observations,',
              lambda m: f'{m.group(1)}opacity_observations,\n{m.group(1)}fill_opacity_observations,\n{m.group(1)}shape_image_threshold_observations,',
              text,
          )
          if count != 3:
              raise SystemExit(f'run tuple/init plumbing: expected 3 occurrences, found {count}')

          once(
              '        let mut opacity_observations = Vec::new();\n        let mut shape_image_threshold_observations = Vec::new();',
              '        let mut opacity_observations = Vec::new();\n        let mut fill_opacity_observations = Vec::new();\n        let mut shape_image_threshold_observations = Vec::new();',
              'observation vector',
          )

          opacity_dispatch = '''            if property_name.eq_ignore_ascii_case("opacity") {
              let value_range = cursor.window_for(occurrence.value())?;
              let value_items = &tokenizer_result.lexical_items()[value_range];
              opacity_observations.push(CssOpacityQualificationObservation {
                  occurrence_index,
                  placement: occurrence.placement(),
                  outcome: qualify_opacity_value(value_items),
              });
              continue;
          }
          '''.replace('          ', '')
          fill_dispatch = '''
          
              if property_name.eq_ignore_ascii_case("fill-opacity") {
                  let value_range = cursor.window_for(occurrence.value())?;
                  let value_items = &tokenizer_result.lexical_items()[value_range];
                  fill_opacity_observations.push(CssFillOpacityQualificationObservation {
                      occurrence_index,
                      placement: occurrence.placement(),
                      outcome: qualify_fill_opacity_value(value_items),
                  });
                  continue;
              }
          '''.replace('          ', '')
          once(opacity_dispatch, opacity_dispatch + fill_dispatch, 'fill-opacity dispatch')

          qualifier_marker = '\nfn qualify_shape_image_threshold_value('
          fill_qualifier = '''
          fn qualify_fill_opacity_value(items: &[CssLexicalItem]) -> CssFillOpacityQualificationOutcome {
              if contains_deferred_substitution_function(items) {
                  return CssFillOpacityQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssFillOpacityUnsupportedReason::DeferredSubstitutionFunction,
                  );
              }

              if is_entire_whole_value_function(items) {
                  return CssFillOpacityQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssFillOpacityUnsupportedReason::WholeValueFunction,
                  );
              }

              if entire_function_name(items).is_some() {
                  return CssFillOpacityQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssFillOpacityUnsupportedReason::FunctionValue,
                  );
              }

              let mut tokens = items.iter().filter_map(|item| match item {
                  CssLexicalItem::SemanticToken(token)
                      if !matches!(token.kind(), CssTokenKind::Whitespace) =>
                  {
                      Some(token)
                  }
                  _ => None,
              });

              let Some(token) = tokens.next() else {
                  return CssFillOpacityQualificationOutcome::InvalidForSelectedValueGrammar;
              };
              if tokens.next().is_some() {
                  return CssFillOpacityQualificationOutcome::InvalidForSelectedValueGrammar;
              }

              match token.kind() {
                  CssTokenKind::Number { .. } => CssFillOpacityQualificationOutcome::Qualified(
                      CssFillOpacityValue::DirectNumberLiteral,
                  ),
                  CssTokenKind::Percentage { .. } => CssFillOpacityQualificationOutcome::Qualified(
                      CssFillOpacityValue::DirectPercentageLiteral,
                  ),
                  CssTokenKind::Ident(identifier) if is_css_wide_keyword(identifier) => {
                      CssFillOpacityQualificationOutcome::UnsupportedBySelectedValueProfile(
                          CssFillOpacityUnsupportedReason::CssWideKeyword,
                      )
                  }
                  _ => CssFillOpacityQualificationOutcome::InvalidForSelectedValueGrammar,
              }
          }
          '''.replace('          ', '')
          once(qualifier_marker, '\n' + fill_qualifier + qualifier_marker, 'fill-opacity qualifier')

          path.write_text(text)
          PY

      - name: Format and focused validation
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo test -p frontend-analysis-core fill_opacity_value_qualification_tests

      - name: Commit production candidate and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-fill-opacity-implementation.yml
          git add crates/frontend-analysis-core/src/css/value_qualification.rs \
                  crates/frontend-analysis-core/src/css/validation/mod.rs \
                  crates/frontend-analysis-core/src/css/validation/fill_opacity_value_qualification_tests.rs \
                  .github/workflows/temporary-fill-opacity-implementation.yml
          test "$(git diff --cached --name-only | grep -v '^\.github/workflows/temporary-fill-opacity-implementation.yml$' | sort)" = "$(printf '%s\n' \
            crates/frontend-analysis-core/src/css/validation/fill_opacity_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/value_qualification.rs | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(css): add bounded fill-opacity value qualification'
          git push origin HEAD:feat/css-fill-opacity-value-qualification
