name: Temporary print-color-adjust patch runner

on:
  push:
    branches:
      - feat/css-print-color-adjust-487

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact print-color-adjust sibling insertion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout feat/css-print-color-adjust-487
          if [ "$(git log -1 --pretty=%s)" != "chore: rerun exact temporary print-color-adjust patch runner" ]; then
            exit 0
          fi

          python3 .github/tmp/apply_print_color_adjust_487.py
          cargo fmt --all

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(crates/frontend-analysis-core/src/css/value_qualification.rs|crates/frontend-analysis-core/src/css/validation/print_color_adjust_value_qualification_tests.rs|crates/frontend-analysis-core/src/css/validation/mod.rs)$' || true)"
          test -z "$unexpected" || { echo "unexpected formatted paths:"; echo "$unexpected"; exit 1; }

          git diff --check -- \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/print_color_adjust_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs

          git config user.name "YT-TechDev"
          git config user.email "msc_prop@proton.me"
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/print_color_adjust_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git diff --cached --quiet && { echo 'no candidate changes'; exit 1; }
          git commit -m "feat(css): add bounded print-color-adjust qualification"
          git push origin HEAD:feat/css-print-color-adjust-487
