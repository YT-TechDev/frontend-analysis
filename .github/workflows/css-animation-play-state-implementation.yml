name: CSS animation-play-state implementation

on:
  push:
    branches:
      - css-animation-play-state-list
    paths:
      - .github/workflows/css-animation-play-state-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: css-animation-play-state-list
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Apply focused implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          value_path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          validation_mod_path = Path("crates/frontend-analysis-core/src/css/validation/mod.rs")
          test_path = Path("crates/frontend-analysis-core/src/css/validation/animation_play_state_value_qualification_tests.rs")

          source = value_path.read_text()
          if "CssAnimationPlayStateValue" in source:
              raise SystemExit("animation-play-state implementation already present")

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one anchor, found {count}: {old[:100]!r}")
              return text.replace(old, new, 1)

          types = r'''
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssAnimationPlayStateValue {
              Running,
              Paused,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssAnimationPlayStateUnsupportedReason {
              CssWideKeyword,
              DeferredSubstitutionFunction,
              WholeValueFunction,
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub(crate) enum CssAnimationPlayStateQualificationOutcome {
              Qualified(Vec<CssAnimationPlayStateValue>),
              InvalidForSelectedValueGrammar,
              UnsupportedBySelectedValueProfile(CssAnimationPlayStateUnsupportedReason),
          }

          /// One selected ordinary declaration's bounded `animation-play-state`
          /// qualification.
          ///
          /// This profile recognizes only the authored
          /// `<single-animation-play-state>#` grammar. Ordered list values are
          /// retained as property-specific `Running | Paused` items. Exact source
          /// evidence, separators, trivia, and occurrence identity remain owned by
          /// the upstream tokenizer/parser result; no animation runtime or
          /// coordinating-list semantics are derived here.
          #[derive(Debug, Clone, PartialEq, Eq)]
          pub(crate) struct CssAnimationPlayStateQualificationObservation {
              occurrence_index: usize,
              placement: CssDeclarationPlacement,
              outcome: CssAnimationPlayStateQualificationOutcome,
          }

          impl CssAnimationPlayStateQualificationObservation {
              pub(crate) const fn occurrence_index(&self) -> usize {
                  self.occurrence_index
              }

              pub(crate) const fn placement(&self) -> CssDeclarationPlacement {
                  self.placement
              }

              pub(crate) const fn outcome(&self) -> &CssAnimationPlayStateQualificationOutcome {
                  &self.outcome
              }
          }

          '''
          source = replace_once(
              source,
              "/// Run-owned result for the currently selected bounded CSS value capabilities.\n",
              types + "/// Run-owned result for the currently selected bounded CSS value capabilities.\n",
          )

          source = replace_once(
              source,
              "    aspect_ratio_observations: Vec<CssAspectRatioQualificationObservation>,\n}",
              "    aspect_ratio_observations: Vec<CssAspectRatioQualificationObservation>,\n    animation_play_state_observations: Vec<CssAnimationPlayStateQualificationObservation>,\n}",
          )

          source = replace_once(
              source,
              "    pub(crate) const fn execution_completion(&self) -> CssParserExecutionCompletion {\n",
              "    pub(crate) fn animation_play_state_observations(\n        &self,\n    ) -> &[CssAnimationPlayStateQualificationObservation] {\n        &self.animation_play_state_observations\n    }\n\n    pub(crate) const fn execution_completion(&self) -> CssParserExecutionCompletion {\n",
          )

          source = replace_once(
              source,
              "        aspect_ratio_observations,\n    ) = {",
              "        aspect_ratio_observations,\n        animation_play_state_observations,\n    ) = {",
          )

          source = replace_once(
              source,
              "        let mut aspect_ratio_observations = Vec::new();\n",
              "        let mut aspect_ratio_observations = Vec::new();\n        let mut animation_play_state_observations = Vec::new();\n",
          )

          dispatch_anchor = r'''            if property_name.eq_ignore_ascii_case("aspect-ratio") {
              let value_range = cursor.window_for(occurrence.value())?;
              let value_items = &tokenizer_result.lexical_items()[value_range];
              aspect_ratio_observations.push(CssAspectRatioQualificationObservation {
                  occurrence_index,
                  placement: occurrence.placement(),
                  outcome: qualify_aspect_ratio_value(value_items),
              });
              continue;
          }

          '''
          dispatch_new = dispatch_anchor + r'''            if property_name.eq_ignore_ascii_case("animation-play-state") {
              let value_range = cursor.window_for(occurrence.value())?;
              let value_items = &tokenizer_result.lexical_items()[value_range];
              animation_play_state_observations.push(
                  CssAnimationPlayStateQualificationObservation {
                      occurrence_index,
                      placement: occurrence.placement(),
                      outcome: qualify_animation_play_state_value(value_items),
                  },
              );
              continue;
          }

          '''
          source = replace_once(source, dispatch_anchor, dispatch_new)

          source = replace_once(
              source,
              "            aspect_ratio_observations,\n        )\n",
              "            aspect_ratio_observations,\n            animation_play_state_observations,\n        )\n",
          )

          source = replace_once(
              source,
              "        aspect_ratio_observations,\n    })\n",
              "        aspect_ratio_observations,\n        animation_play_state_observations,\n    })\n",
          )

          qualifier = r'''
          fn animation_play_state_item_value(
              items: &[CssLexicalItem],
          ) -> Option<CssAnimationPlayStateValue> {
              let mut tokens = items.iter().filter_map(|item| match item {
                  CssLexicalItem::SemanticToken(token)
                      if !matches!(token.kind(), CssTokenKind::Whitespace) =>
                  {
                      Some(token)
                  }
                  _ => None,
              });

              let token = tokens.next()?;
              if tokens.next().is_some() {
                  return None;
              }

              match token.kind() {
                  CssTokenKind::Ident(identifier)
                      if identifier.eq_ignore_ascii_case("running") =>
                  {
                      Some(CssAnimationPlayStateValue::Running)
                  }
                  CssTokenKind::Ident(identifier)
                      if identifier.eq_ignore_ascii_case("paused") =>
                  {
                      Some(CssAnimationPlayStateValue::Paused)
                  }
                  _ => None,
              }
          }

          /// Qualifies one retained `animation-play-state` declaration value
          /// against `<single-animation-play-state>#`, where each item is
          /// `running | paused`.
          ///
          /// Deferred substitution is checked before list recognition because it
          /// can change top-level separator structure. The list walk then splits
          /// only on retained depth-zero `Comma` tokens. Commas inside Functions
          /// or other balanced blocks remain inside the current item. Leading,
          /// trailing, and consecutive top-level commas therefore produce empty
          /// items and fail the selected grammar without any raw-source search or
          /// reconstruction.
          fn qualify_animation_play_state_value(
              items: &[CssLexicalItem],
          ) -> CssAnimationPlayStateQualificationOutcome {
              if contains_deferred_substitution_function(items) {
                  return CssAnimationPlayStateQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssAnimationPlayStateUnsupportedReason::DeferredSubstitutionFunction,
                  );
              }

              if is_entire_whole_value_function(items) {
                  return CssAnimationPlayStateQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssAnimationPlayStateUnsupportedReason::WholeValueFunction,
                  );
              }

              let mut whole_value_tokens = items.iter().filter_map(|item| match item {
                  CssLexicalItem::SemanticToken(token)
                      if !matches!(token.kind(), CssTokenKind::Whitespace) =>
                  {
                      Some(token)
                  }
                  _ => None,
              });
              if let (Some(only_token), None) =
                  (whole_value_tokens.next(), whole_value_tokens.next())
                  && let CssTokenKind::Ident(identifier) = only_token.kind()
                  && is_css_wide_keyword(identifier)
              {
                  return CssAnimationPlayStateQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssAnimationPlayStateUnsupportedReason::CssWideKeyword,
                  );
              }

              let mut values = Vec::new();
              let mut block_stack: Vec<CssValueBlockCloser> = Vec::new();
              let mut item_start = 0usize;

              for (index, item) in items.iter().enumerate() {
                  if block_stack.is_empty()
                      && matches!(
                          item,
                          CssLexicalItem::SemanticToken(token)
                              if matches!(token.kind(), CssTokenKind::Comma)
                      )
                  {
                      let Some(value) = animation_play_state_item_value(&items[item_start..index])
                      else {
                          return CssAnimationPlayStateQualificationOutcome::InvalidForSelectedValueGrammar;
                      };
                      values.push(value);
                      item_start = index + 1;
                      continue;
                  }

                  let CssLexicalItem::SemanticToken(token) = item else {
                      continue;
                  };
                  match token.kind() {
                      CssTokenKind::Function(_) | CssTokenKind::LeftParenthesis => {
                          block_stack.push(CssValueBlockCloser::Parenthesis);
                      }
                      CssTokenKind::LeftSquareBracket => {
                          block_stack.push(CssValueBlockCloser::SquareBracket);
                      }
                      CssTokenKind::LeftCurlyBracket => {
                          block_stack.push(CssValueBlockCloser::CurlyBracket);
                      }
                      CssTokenKind::RightParenthesis
                          if block_stack.last() == Some(&CssValueBlockCloser::Parenthesis) =>
                      {
                          block_stack.pop();
                      }
                      CssTokenKind::RightSquareBracket
                          if block_stack.last() == Some(&CssValueBlockCloser::SquareBracket) =>
                      {
                          block_stack.pop();
                      }
                      CssTokenKind::RightCurlyBracket
                          if block_stack.last() == Some(&CssValueBlockCloser::CurlyBracket) =>
                      {
                          block_stack.pop();
                      }
                      _ => {}
                  }
              }

              let Some(value) = animation_play_state_item_value(&items[item_start..]) else {
                  return CssAnimationPlayStateQualificationOutcome::InvalidForSelectedValueGrammar;
              };
              values.push(value);

              CssAnimationPlayStateQualificationOutcome::Qualified(values)
          }

          '''
          source = replace_once(source, "fn qualify_scroll_snap_align_value(\n", qualifier + "fn qualify_scroll_snap_align_value(\n")
          value_path.write_text(source)

          validation_mod = validation_mod_path.read_text()
          validation_mod = replace_once(
              validation_mod,
              "#[cfg(test)]\nmod aspect_ratio_value_qualification_tests;\n",
              "#[cfg(test)]\nmod animation_play_state_value_qualification_tests;\n#[cfg(test)]\nmod aspect_ratio_value_qualification_tests;\n",
          )
          validation_mod_path.write_text(validation_mod)

          tests = r'''use crate::css::analysis::analyze_css_source;
          use crate::css::parser::resource::CssParserLimits;
          use crate::css::parser::result::CssParserExecutionCompletion;
          use crate::css::tokenizer::resource::CssTokenizerLimits;
          use crate::css::value_qualification::{
              CssAnimationPlayStateQualificationOutcome, CssAnimationPlayStateUnsupportedReason,
              CssAnimationPlayStateValue, CssValueQualificationRunResult, run,
          };
          use crate::{SourceId, SourceText};

          fn tokenizer_limits() -> CssTokenizerLimits {
              CssTokenizerLimits::new(4096, 100_000, 8192, 1024, 8192, 8192).unwrap()
          }

          fn parser_limits() -> CssParserLimits {
              parser_limits_with_occurrences(8192)
          }

          fn parser_limits_with_occurrences(max_declaration_occurrences: usize) -> CssParserLimits {
              CssParserLimits::new(
                  100_000,
                  256,
                  256,
                  max_declaration_occurrences,
                  1024,
                  1024,
                  1024,
                  1024,
                  8192,
              )
              .unwrap()
          }

          fn qualify(source_id: u64, css: &str) -> CssValueQualificationRunResult {
              qualify_with_limits(source_id, css, parser_limits())
          }

          fn qualify_with_limits(
              source_id: u64,
              css: &str,
              parser_limits: CssParserLimits,
          ) -> CssValueQualificationRunResult {
              let source = SourceText::new(SourceId::new(source_id), css.to_owned());
              let parser_result = analyze_css_source(&source, tokenizer_limits(), parser_limits).unwrap();
              run(parser_result).unwrap()
          }

          fn qualified(values: &[CssAnimationPlayStateValue]) -> CssAnimationPlayStateQualificationOutcome {
              CssAnimationPlayStateQualificationOutcome::Qualified(values.to_vec())
          }

          fn unsupported(
              reason: CssAnimationPlayStateUnsupportedReason,
          ) -> CssAnimationPlayStateQualificationOutcome {
              CssAnimationPlayStateQualificationOutcome::UnsupportedBySelectedValueProfile(reason)
          }

          fn assert_expected(
              result: &CssValueQualificationRunResult,
              expected: &[CssAnimationPlayStateQualificationOutcome],
          ) {
              let actual: Vec<_> = result
                  .animation_play_state_observations()
                  .iter()
                  .map(|observation| observation.outcome().clone())
                  .collect();
              assert_eq!(actual, expected);
          }

          #[test]
          fn direct_single_and_repeated_list_items_preserve_authored_order() {
              use CssAnimationPlayStateValue::{Paused, Running};

              let result = qualify(
                  5680,
                  concat!(
                      "a{animation-play-state:running;}",
                      "b{animation-play-state:paused;}",
                      "c{animation-play-state:running, paused;}",
                      "d{animation-play-state:paused,running,paused;}",
                      "e{animation-play-state:RUNNING,PaUsEd;}",
                      "f{animation-play-state:r\\75 nning,p\\61 used;}",
                  ),
              );

              assert_expected(
                  &result,
                  &[
                      qualified(&[Running]),
                      qualified(&[Paused]),
                      qualified(&[Running, Paused]),
                      qualified(&[Paused, Running, Paused]),
                      qualified(&[Running, Paused]),
                      qualified(&[Running, Paused]),
                  ],
              );
              assert_eq!(
                  result.execution_completion(),
                  CssParserExecutionCompletion::Complete
              );
          }

          #[test]
          fn retained_comma_tokens_and_trivia_define_list_separators() {
              use CssAnimationPlayStateValue::{Paused, Running};

              let result = qualify(
                  5681,
                  concat!(
                      "a{animation-play-state:running/**/,/**/paused;}",
                      "b{animation-play-state: running , paused , running ;}",
                      "c{animation-play-state:running/*,*/ , /*,*/paused;}",
                  ),
              );

              assert_expected(
                  &result,
                  &[
                      qualified(&[Running, Paused]),
                      qualified(&[Running, Paused, Running]),
                      qualified(&[Running, Paused]),
                  ],
              );
          }

          #[test]
          fn empty_items_missing_separators_and_wrong_direct_items_are_invalid() {
              use CssAnimationPlayStateQualificationOutcome::InvalidForSelectedValueGrammar as Invalid;

              let result = qualify(
                  5682,
                  concat!(
                      "a{animation-play-state:;}",
                      "b{animation-play-state:,running;}",
                      "c{animation-play-state:running,;}",
                      "d{animation-play-state:running,,paused;}",
                      "e{animation-play-state:running paused;}",
                      "f{animation-play-state:auto;}",
                      "g{animation-play-state:running,auto;}",
                      "h{animation-play-state:1,paused;}",
                      "i{animation-play-state:running/paused;}",
                  ),
              );

              assert_expected(&result, &[Invalid; 9]);
          }

          #[test]
          fn css_wide_keyword_is_unsupported_only_as_the_entire_value() {
              use CssAnimationPlayStateQualificationOutcome::InvalidForSelectedValueGrammar as Invalid;
              use CssAnimationPlayStateUnsupportedReason::CssWideKeyword;

              let whole = qualify(
                  5683,
                  concat!(
                      "a{animation-play-state:inherit;}",
                      "b{animation-play-state:initial;}",
                      "c{animation-play-state:unset;}",
                      "d{animation-play-state:revert;}",
                      "e{animation-play-state:revert-layer;}",
                  ),
              );
              assert_expected(
                  &whole,
                  &[
                      unsupported(CssWideKeyword),
                      unsupported(CssWideKeyword),
                      unsupported(CssWideKeyword),
                      unsupported(CssWideKeyword),
                      unsupported(CssWideKeyword),
                  ],
              );

              let mixed = qualify(
                  5684,
                  concat!(
                      "a{animation-play-state:running,inherit;}",
                      "b{animation-play-state:initial,paused;}",
                  ),
              );
              assert_expected(&mixed, &[Invalid; 2]);
          }

          #[test]
          fn deferred_substitution_precedes_comma_list_recognition_everywhere() {
              use CssAnimationPlayStateUnsupportedReason::DeferredSubstitutionFunction;

              let result = qualify(
                  5685,
                  concat!(
                      "a{animation-play-state:var(--x);}",
                      "b{animation-play-state:running,var(--x);}",
                      "c{animation-play-state:var(--x),paused;}",
                      "d{animation-play-state:running,var(--x,paused);}",
                      "e{animation-play-state:foo(var(--x),paused);}",
                  ),
              );

              assert_expected(
                  &result,
                  &[
                      unsupported(DeferredSubstitutionFunction),
                      unsupported(DeferredSubstitutionFunction),
                      unsupported(DeferredSubstitutionFunction),
                      unsupported(DeferredSubstitutionFunction),
                      unsupported(DeferredSubstitutionFunction),
                  ],
              );
          }

          #[test]
          fn whole_value_function_boundary_does_not_legalize_function_items() {
              use CssAnimationPlayStateQualificationOutcome::InvalidForSelectedValueGrammar as Invalid;
              use CssAnimationPlayStateUnsupportedReason::WholeValueFunction;

              let whole = qualify(5686, "a{animation-play-state:first-valid(running,paused);}");
              assert_expected(&whole, &[unsupported(WholeValueFunction)]);

              let items = qualify(
                  5687,
                  concat!(
                      "a{animation-play-state:running,first-valid(paused);}",
                      "b{animation-play-state:foo(running,paused);}",
                      "c{animation-play-state:foo(a,b),running;}",
                  ),
              );
              assert_expected(&items, &[Invalid; 3]);
          }

          #[test]
          fn important_priority_is_outside_the_semantic_list_window() {
              use CssAnimationPlayStateValue::{Paused, Running};

              let result = qualify(5688, "a{animation-play-state:running,paused !important;}");
              assert_expected(&result, &[qualified(&[Running, Paused])]);
              assert!(
                  result.upstream_parser_result().occurrences()[0]
                      .priority()
                      .is_some()
              );
          }

          #[test]
          fn duplicate_occurrences_and_existing_leaf_dispatch_remain_separate() {
              use CssAnimationPlayStateValue::{Paused, Running};

              let result = qualify(
                  5689,
                  concat!(
                      "a{animation-play-state:running;animation-play-state:paused,running;}",
                      "b{aspect-ratio:16/9;}",
                  ),
              );

              assert_expected(
                  &result,
                  &[qualified(&[Running]), qualified(&[Paused, Running])],
              );
              assert_eq!(result.animation_play_state_observations().len(), 2);
              assert_eq!(result.animation_play_state_observations()[0].occurrence_index(), 0);
              assert_eq!(result.animation_play_state_observations()[1].occurrence_index(), 1);
              assert_eq!(result.aspect_ratio_observations().len(), 1);
          }

          #[test]
          fn nonordinary_contexts_do_not_enter_animation_play_state_dispatch() {
              for (source_id, css) in [
                  (5690, "@font-face{animation-play-state:running;}"),
                  (5691, "@page{animation-play-state:running;}"),
                  (5692, "@keyframes k{from{animation-play-state:running;}}"),
              ] {
                  let result = qualify(source_id, css);
                  assert!(
                      result.animation_play_state_observations().is_empty(),
                      "nonordinary context produced observation for {css:?}"
                  );
              }
          }

          #[test]
          fn unmatched_or_nested_block_evidence_cannot_fake_top_level_items() {
              use CssAnimationPlayStateQualificationOutcome::InvalidForSelectedValueGrammar as Invalid;

              let result = qualify(
                  5693,
                  concat!(
                      "a{animation-play-state:running),paused;}",
                      "b{animation-play-state:(running,paused);}",
                      "c{animation-play-state:foo(running,paused),paused;}",
                  ),
              );
              assert_expected(&result, &[Invalid; 3]);
          }

          #[test]
          fn committed_prefix_and_repeated_cross_source_runs_preserve_lifecycle() {
              use CssAnimationPlayStateValue::{Paused, Running};

              let incomplete = qualify_with_limits(
                  5694,
                  "a{animation-play-state:running;}b{animation-play-state:paused,running;}",
                  parser_limits_with_occurrences(1),
              );
              assert_eq!(
                  incomplete.execution_completion(),
                  CssParserExecutionCompletion::Incomplete
              );
              assert_expected(&incomplete, &[qualified(&[Running])]);

              let css = concat!(
                  "a{animation-play-state:running,paused;}",
                  "b{animation-play-state:running,,paused;}",
                  "c{animation-play-state:var(--x);}",
              );
              let first = qualify(5695, css);
              let repeated = qualify(5695, css);
              let another_source = qualify(5696, css);

              assert_eq!(
                  first.animation_play_state_observations(),
                  repeated.animation_play_state_observations()
              );
              assert_eq!(
                  first.animation_play_state_observations(),
                  another_source.animation_play_state_observations()
              );
          }
          '''
          test_path.write_text(tests)
          PY

          cargo fmt --all
          git diff --check

          expected_paths="$(printf '%s\n' \
            crates/frontend-analysis-core/src/css/validation/animation_play_state_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/value_qualification.rs | sort)"
          actual_paths="$(git status --short | awk '{print $2}' | grep -v '^\.github/workflows/css-animation-play-state-implementation.yml$' | sort)"
          test "$actual_paths" = "$expected_paths"

      - name: Validate focused implementation
        shell: bash
        run: |
          cargo test --workspace --all-targets --all-features animation_play_state_value_qualification_tests
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo metadata --offline --format-version 1 --locked >/dev/null
          git diff --check

      - name: Commit focused candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/animation_play_state_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git commit -m "feat(css): qualify animation-play-state comma-separated list" -m "Refs #568."
          git push origin HEAD:css-animation-play-state-list
