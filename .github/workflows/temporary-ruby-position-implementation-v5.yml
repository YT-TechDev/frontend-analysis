name: Temporary ruby-position implementation v5

on:
  push:
    branches:
      - feat/css-ruby-position-value-qualification-551
    paths:
      - .github/workflows/temporary-ruby-position-implementation-v5.yml

permissions:
  contents: write

jobs:
  implement-and-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Apply corrected bounded ruby-position leaf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-ruby-position-implementation-v3.yml').read_text()
          start_marker = '      - name: Apply bounded ruby-position leaf\n'
          end_marker = '      - name: Format candidate\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          run_marker = '        run: |\n'
          script = textwrap.dedent(block[block.index(run_marker) + len(run_marker):])

          old = (
              'if remaining != 2:\n'
              '    raise SystemExit(f"return tuple / constructor: expected 2 anchors, found {remaining}")\n'
              'tail = tail.replace(pair, pair_with_position)\n'
              'source = source[:tuple_end] + tail\n'
          )
          new = (
              'if remaining != 1:\n'
              '    raise SystemExit(f"return tuple: expected 1 anchor, found {remaining}")\n'
              'tail = tail.replace(pair, pair_with_position, 1)\n'
              'source = source[:tuple_end] + tail\n\n'
              'source = replace_once(\n'
              '    source,\n'
              '    "        ruby_merge_observations,\\n        ruby_overhang_observations,\\n        clip_rule_observations,",\n'
              '    "        ruby_merge_observations,\\n        ruby_position_observations,\\n        ruby_overhang_observations,\\n        clip_rule_observations,",\n'
              '    "result constructor field",\n'
              ')\n'
          )
          if old not in script:
              raise SystemExit('v3 correction anchor not found')
          Path('/tmp/apply-ruby-position.sh').write_text(script.replace(old, new, 1))
          PY
          bash /tmp/apply-ruby-position.sh

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Run focused ruby-position tests
        run: cargo test -p frontend-analysis-core ruby_position_value_qualification_tests

      - name: Run Core Clippy
        run: cargo clippy -p frontend-analysis-core --all-targets --all-features -- -D warnings

      - name: Run Core full suite
        run: cargo test -p frontend-analysis-core

      - name: Commit sealed candidate and remove transport workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/temporary-ruby-position-implementation.yml \
            .github/workflows/temporary-ruby-position-implementation-v2.yml \
            .github/workflows/temporary-ruby-position-implementation-v3.yml \
            .github/workflows/temporary-ruby-position-implementation-v4.yml \
            .github/workflows/temporary-ruby-position-implementation-v5.yml
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/ruby_position_value_qualification_tests.rs
          git diff --cached --check
          git commit -m "feat(css): add bounded ruby-position value qualification"
          git push origin HEAD:feat/css-ruby-position-value-qualification-551
