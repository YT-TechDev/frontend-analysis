name: Temporary text-emphasis-position format fix

on:
  push:
    branches:
      - feat/css-text-emphasis-position-value-qualification-549
    paths:
      - .github/workflows/temporary-text-emphasis-position-format-fix.yml

permissions:
  contents: write

jobs:
  format-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Format and verify focused delta
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          expected="crates/frontend-analysis-core/src/css/validation/text_emphasis_position_value_qualification_tests.rs"
          actual="$(git diff --name-only)"
          test "$actual" = "$expected"

      - name: Commit format-only remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/frontend-analysis-core/src/css/validation/text_emphasis_position_value_qualification_tests.rs
          git rm .github/workflows/temporary-text-emphasis-position-format-fix.yml
          git diff --cached --check
          git commit -m "style(css): format text-emphasis-position tests"

          expected="$(printf '%s\n' \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/text_emphasis_position_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/value_qualification.rs | sort)"
          actual="$(git diff --name-only 6e123de4e44aef868484ca907a031155cb8f9b67 HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check 6e123de4e44aef868484ca907a031155cb8f9b67 HEAD
          git push origin HEAD:feat/css-text-emphasis-position-value-qualification-549
