name: CSS animation-play-state implementation retry

on:
  push:
    branches:
      - css-animation-play-state-list
    paths:
      - .github/workflows/css-animation-play-state-implementation-retry.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: css-animation-play-state-list
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Apply corrected focused implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/css-animation-play-state-implementation.yml').read_text()
          marker = "          python3 <<'PY'\n"
          terminator = "\n          PY"
          script = workflow.split(marker, 1)[1].split(terminator, 1)[0]
          script = textwrap.dedent(script)

          exact_dispatch = (
              "dispatch_anchor = r'''            if property_name.eq_ignore_ascii_case(\"aspect-ratio\") {\n"
              "                let value_range = cursor.window_for(occurrence.value())?;\n"
              "                let value_items = &tokenizer_result.lexical_items()[value_range];\n"
              "                aspect_ratio_observations.push(CssAspectRatioQualificationObservation {\n"
              "                    occurrence_index,\n"
              "                    placement: occurrence.placement(),\n"
              "                    outcome: qualify_aspect_ratio_value(value_items),\n"
              "                });\n"
              "                continue;\n"
              "            }\n\n"
              "'''\n"
              "dispatch_new ="
          )

          script, count = re.subn(
              r"dispatch_anchor = r'''[\s\S]*?'''\ndispatch_new =",
              lambda _: exact_dispatch,
              script,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'failed to repair dispatch anchor: {count}')

          exec(compile(script, '<focused-implementation>', 'exec'))

          test_path = Path('crates/frontend-analysis-core/src/css/validation/animation_play_state_value_qualification_tests.rs')
          tests = test_path.read_text()
          tests, count = re.subn(
              r'assert_expected\(&([a-z_]+), &\[Invalid; ([0-9]+)\]\);',
              lambda m: f'let expected = vec![Invalid; {m.group(2)}];\n    assert_expected(&{m.group(1)}, &expected);',
              tests,
          )
          if count != 4:
              raise SystemExit(f'expected four non-Copy repeat fixes, found {count}')

          old = "fn committed_prefix_and_repeated_cross_source_runs_preserve_lifecycle() {\n    use CssAnimationPlayStateValue::{Paused, Running};"
          new = "fn committed_prefix_and_repeated_cross_source_runs_preserve_lifecycle() {\n    use CssAnimationPlayStateValue::Running;"
          if tests.count(old) != 1:
              raise SystemExit('expected exactly one lifecycle import anchor')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests)
          PY

          cargo fmt --all
          git diff --check

          expected_paths="$(printf '%s\n' \
            crates/frontend-analysis-core/src/css/validation/animation_play_state_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/value_qualification.rs | sort)"
          actual_paths="$(git status --short | awk '{print $2}' | grep -v '^\.github/workflows/css-animation-play-state-implementation' | sort)"
          test "$actual_paths" = "$expected_paths"

      - name: Validate focused implementation
        shell: bash
        run: |
          cargo test --workspace --all-targets --all-features animation_play_state_value_qualification_tests
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
          cargo metadata --offline --format-version 1 --locked >/dev/null
          git diff --check

      - name: Commit focused candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/animation_play_state_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git commit -m "feat(css): qualify animation-play-state comma-separated list" -m "Refs #568."
          git push origin HEAD:css-animation-play-state-list
