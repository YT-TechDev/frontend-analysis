name: Temporary overflow-wrap patch runner

on:
  push:
    branches:
      - feat/css-overflow-wrap-value-qualification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact overflow-wrap sibling insertion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout feat/css-overflow-wrap-value-qualification
          if [ "$(git log -1 --pretty=%s)" != "chore: rerun temporary overflow-wrap patch runner" ]; then
            exit 0
          fi

          python3 .github/tmp-overflow-wrap-489.py
          cargo fmt --all

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(crates/frontend-analysis-core/src/css/value_qualification.rs|crates/frontend-analysis-core/src/css/validation/overflow_wrap_value_qualification_tests.rs|crates/frontend-analysis-core/src/css/validation/mod.rs)$' || true)"
          test -z "$unexpected" || { echo "unexpected formatted paths:"; echo "$unexpected"; exit 1; }

          git diff --check -- \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/overflow_wrap_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs

          cargo test --workspace --all-targets --all-features css::validation::overflow_wrap_value_qualification_tests

          git config user.name "YT-TechDev"
          git config user.email "msc_prop@proton.me"
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/overflow_wrap_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git diff --cached --quiet && { echo 'no candidate changes'; exit 1; }
          git commit -m "feat(css): add bounded overflow-wrap qualification"
          git push origin HEAD:feat/css-overflow-wrap-value-qualification
