name: temporary font-variant-numeric sealing

on:
  push:
    branches:
      - feat/css-font-variant-numeric-value-qualification-538
    paths:
      - .github/workflows/tmp-font-variant-numeric-seal.yml
      - .github/tmp-font-variant-numeric-seal.py
      - .github/tmp-font-variant-numeric-carry-fix.py

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/css-font-variant-numeric-value-qualification-538

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Apply bounded candidate
        run: |
          python3 .github/tmp-font-variant-numeric-seal.py
          python3 .github/tmp-font-variant-numeric-carry-fix.py

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Validate patch hygiene
        run: git diff --check

      - name: Run focused tests
        run: cargo test -p frontend-analysis-core --all-features font_variant_numeric_value_qualification_tests

      - name: Validate Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Core full suite
        run: cargo test -p frontend-analysis-core --all-targets --all-features

      - name: Commit tested production candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/font_variant_numeric_value_qualification_tests.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs
          git diff --cached --check
          git commit -m 'feat(css): add bounded font-variant-numeric value qualification'
          git push origin HEAD:feat/css-font-variant-numeric-value-qualification-538
