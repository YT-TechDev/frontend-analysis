name: Temporary #171 Validation

on:
  push:
    branches:
      - feat/css-keyframes-contexts-171

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply candidate patch
        shell: bash
        run: |
          cat .github/patches/171-*.b64 | base64 -d | gzip -d > /tmp/171.patch
          git apply --check /tmp/171.patch
          git apply /tmp/171.patch
          git diff --check

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Validate locked metadata
        run: cargo metadata --offline --format-version 1 --locked

      - name: Audit candidate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git status --short

      - name: Commit validated implementation
        shell: bash
        run: |
          git rm .github/workflows/_snapshot-171.yml .github/patches/171-00.b64 .github/patches/171-01.b64
          git add -- \
            crates/frontend-analysis-core/src/css/declaration.rs \
            crates/frontend-analysis-core/src/css/parser/context.rs \
            crates/frontend-analysis-core/src/css/parser/evidence.rs \
            crates/frontend-analysis-core/src/css/parser/producer.rs \
            crates/frontend-analysis-core/src/css/parser/result.rs \
            crates/frontend-analysis-core/src/css/validation/parser_candidate.rs
          git diff --cached --check
          git config user.name "YT-TechDev"
          git config user.email "271404462+YT-TechDev@users.noreply.github.com"
          git commit -m "feat(core): model CSS keyframes contexts (#171)"
          git push origin HEAD:feat/css-keyframes-contexts-171
