name: Temporary #171 Snapshot

on:
  push:
    branches:
      - feat/css-keyframes-contexts-171

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack working tree
        shell: bash
        run: tar -czf /tmp/frontend-analysis-171.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-analysis-171
          path: /tmp/frontend-analysis-171.tar.gz
          retention-days: 1
