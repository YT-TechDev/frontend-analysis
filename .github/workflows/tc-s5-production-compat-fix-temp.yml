name: TC-S5 Production Compatibility Fix

on:
  push:
    branches:
      - tooling/tc-s5-test-diagnostics

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/html-tc-s5-p-production
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6cf9c8429cfbdf4cd8d40e3f96b0e78708c14623"
          test "$(git status --porcelain)" = ""

      - name: Apply frontier-only production test compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- old ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          validation = "crates/frontend-analysis-core/src/html/tree_construction/validation.rs"
          tc_s3 = "crates/frontend-analysis-core/src/html/tree_construction/in_body_div_successor_production.rs"
          tc_s4 = "crates/frontend-analysis-core/src/html/tree_construction/in_body_div_section_successor_production.rs"

          replace(
              validation,
              """    HtmlDocumentShellAnalysis, HtmlDocumentShellParts, HtmlElement,\n    HtmlSelectedOrdinaryElementName, HtmlShellClosure, HtmlShellElement, HtmlShellElementName,\n""",
              """    HtmlDocumentShellAnalysis, HtmlDocumentShellParts, HtmlElement, HtmlParagraphElementOrigin,\n    HtmlSelectedOrdinaryElementName, HtmlShellClosure, HtmlShellElement, HtmlShellElementName,\n""",
          )

          replace(
              validation,
              """    ]\n}\n\n// ---------------------------------------------------------------------------\n// Mechanical projection from production meaning into the independent model\n""",
              """    ]\n}\n\n/// The TC-S1 G8 `<body><p>` row is frozen historical negative-space evidence.\n/// TC-S5 intentionally supersedes only its rolling production correspondence;\n/// the authored Gold row itself remains unchanged above.\nfn production_correspondence_cases() -> Vec<GoldCase> {\n    gold_cases()\n        .into_iter()\n        .filter(|case| case.id != \"G8\")\n        .collect()\n}\n\n// ---------------------------------------------------------------------------\n// Mechanical projection from production meaning into the independent model\n""",
          )

          replace(
              validation,
              """        HtmlTreeNodeKind::Element(HtmlElement::Paragraph(_)) => {\n            panic!(\"the TC-S1 predecessor GOLD never constructs a TC-S5 Paragraph\")\n        }\n""",
              """        HtmlTreeNodeKind::Element(HtmlElement::Paragraph(paragraph)) => GoldNode::Element {\n            name: \"p\",\n            origin: match paragraph.origin() {\n                HtmlParagraphElementOrigin::Authored { complete, raw_name } => GoldOrigin::Authored(\n                    (complete.range().start(), complete.range().end()),\n                    (raw_name.range().start(), raw_name.range().end()),\n                ),\n                HtmlParagraphElementOrigin::Synthesized(_) => GoldOrigin::None,\n            },\n            children,\n        },\n""",
          )

          replace(
              validation,
              """#[test]\nfn gold_cases_match_exactly() {\n    let mut mismatches = Vec::new();\n    for case in gold_cases() {\n""",
              """#[test]\nfn unsuperseded_gold_cases_match_current_production_exactly() {\n    let mut mismatches = Vec::new();\n    for case in production_correspondence_cases() {\n""",
          )

          replace(
              validation,
              """#[test]\nfn accepted_gold_sources_reach_their_required_completion() {\n    let expected: [(&str, bool); 9] = [\n        (\"\", true),\n        (\"hello\", true),\n        (\"<html><head></head><body></body></html>\", true),\n        (\"<body></body>\", true),\n        (\"<head></head>\", true),\n        (\"<body>x</body>\", true),\n        (\"<body><body></body>\", true),\n        (\"<head><head></head>\", true),\n        (\"<body><p>\", false),\n    ];\n""",
              """#[test]\nfn unsuperseded_gold_sources_reach_their_required_completion() {\n    let expected: [(&str, bool); 8] = [\n        (\"\", true),\n        (\"hello\", true),\n        (\"<html><head></head><body></body></html>\", true),\n        (\"<body></body>\", true),\n        (\"<head></head>\", true),\n        (\"<body>x</body>\", true),\n        (\"<body><body></body>\", true),\n        (\"<head><head></head>\", true),\n    ];\n""",
          )

          replace(
              validation,
              """    let table: Vec<&str> = gold_cases().iter().map(|case| case.source).collect();\n""",
              """    let table: Vec<&str> = production_correspondence_cases()\n        .iter()\n        .map(|case| case.source)\n        .collect();\n""",
          )

          replace(
              validation,
              """                HtmlTreeNodeKind::Element(HtmlElement::Paragraph(_)) => {\n                    unreachable!(\"no TC-S1 GOLD case constructs a TC-S5 Paragraph\")\n                }\n""",
              """                HtmlTreeNodeKind::Element(HtmlElement::Paragraph(paragraph)) => {\n                    match paragraph.origin() {\n                        HtmlParagraphElementOrigin::Authored { complete, .. } => {\n                            assert!(!complete.range().is_empty());\n                        }\n                        HtmlParagraphElementOrigin::Synthesized(_) => assert!(\n                            node.authored_source().is_none(),\n                            \"{}: a synthesized Paragraph has no authored source\",\n                            case.id\n                        ),\n                    }\n                }\n""",
          )

          replace(
              validation,
              """#[test]\nfn g8_freezes_the_terminal_checkpoint_and_leaks_no_unsupported_identity() {\n    let analysis = analyze(\"<body><p>\");\n\n    // The authored body survives, the shell is complete, and no `p` node\n    // exists at all.\n    assert_eq!(analysis.node_count(), 4);\n    assert_eq!(\n        shell_element_count(&analysis, HtmlShellElementName::Body),\n        1\n    );\n\n    let HtmlTreeCompletion::Incomplete(HtmlTreeIncompleteCause::UnsupportedCapability(unsupported)) =\n        analysis.completion()\n    else {\n        panic!(\"G8 is Incomplete(UnsupportedCapability)\")\n    };\n    assert_eq!(\n        unsupported.capability(),\n        HtmlTreeCapability::NonShellElementTag\n    );\n    let trigger = unsupported\n        .trigger()\n        .authored_boundary()\n        .expect(\"authored trigger\");\n    assert_eq!((trigger.range().start(), trigger.range().end()), (6, 9));\n\n    // No node's authored origin is the refused token's range, so no `p`\n    // identity leaks through any surface.\n    for node in analysis.nodes_in_creation_order() {\n        if let Some(HtmlAuthoredSource::StartTag { complete, .. }) = node.authored_source() {\n            assert_ne!(complete.range(), trigger.range());\n        }\n    }\n    // Nor does any action or diagnostic reference the refused token.\n    for action in analysis.actions() {\n        assert!(action.trigger().token_index() < unsupported.trigger().token_index());\n    }\n    for diagnostic in analysis.diagnostics() {\n        assert!(diagnostic.trigger().token_index() < unsupported.trigger().token_index());\n    }\n}\n""",
              """#[test]\nfn g8_historical_tc_s1_boundary_is_frozen_while_tc_s5_owns_current_production() {\n    let g8 = gold_cases()\n        .into_iter()\n        .find(|case| case.id == \"G8\")\n        .expect(\"historical G8 remains in the frozen Gold table\");\n    assert_eq!(g8.source, \"<body><p>\");\n    assert_eq!(\n        g8.completion,\n        GoldCompletion::IncompleteUnsupported((6, 9))\n    );\n    assert_eq!(g8.committed_prefix_end, 6);\n    assert_eq!(g8.diagnostics, &[GoldDiagnostic::MissingDoctype]);\n\n    let analysis = analyze(g8.source);\n    assert!(analysis.is_complete(), \"TC-S5 now owns this production cell\");\n    assert_eq!(analysis.node_count(), 5);\n    assert_eq!(\n        shell_element_count(&analysis, HtmlShellElementName::Body),\n        1\n    );\n\n    let paragraph = analysis\n        .nodes_in_creation_order()\n        .into_iter()\n        .find(|node| matches!(node.kind(), HtmlTreeNodeKind::Element(HtmlElement::Paragraph(_))))\n        .expect(\"TC-S5 constructs one authored Paragraph\");\n    let Some(HtmlAuthoredSource::StartTag { complete, raw_name }) = paragraph.authored_source() else {\n        panic!(\"the TC-S5 Paragraph keeps its own authored start-tag evidence\")\n    };\n    assert_eq!((complete.range().start(), complete.range().end()), (6, 9));\n    assert_eq!((raw_name.range().start(), raw_name.range().end()), (7, 8));\n    assert_eq!(\n        analysis\n            .nodes_in_creation_order()\n            .into_iter()\n            .filter(|node| matches!(\n                node.kind(),\n                HtmlTreeNodeKind::Element(HtmlElement::SelectedOrdinary(_))\n            ))\n            .count(),\n        0,\n        \"P remains separate from the authored-only div/section domain\"\n    );\n}\n""",
          )

          replace(
              validation,
              """#[test]\nfn g8_keeps_tokenizer_coverage_and_committed_tree_coverage_distinct() {\n    let analysis = analyze(\"<body><p>\");\n    let tokenizer_coverage = analysis.tokenizer_run().coverage();\n\n    // The tokenizer completed the whole source.\n    assert!(tokenizer_coverage.is_complete());\n    assert_eq!(tokenizer_coverage.processed_end(), 9);\n    assert!(matches!(\n        analysis.tokenizer_run().completion(),\n        HtmlTokenizerCompletion::Complete\n    ));\n\n    // Committed tree coverage stopped at the last completely processed token.\n    assert_eq!(analysis.coverage().committed_end(), 6);\n    assert_eq!(analysis.coverage().processed_tokens(), 1);\n    assert!(analysis.coverage().committed_end() < tokenizer_coverage.processed_end());\n    assert!(!analysis.is_complete());\n}\n""",
              """#[test]\nfn g8_current_tc_s5_commits_full_tree_coverage_without_rewriting_historical_gold() {\n    let analysis = analyze(\"<body><p>\");\n    let tokenizer_coverage = analysis.tokenizer_run().coverage();\n\n    assert!(tokenizer_coverage.is_complete());\n    assert_eq!(tokenizer_coverage.processed_end(), 9);\n    assert!(matches!(\n        analysis.tokenizer_run().completion(),\n        HtmlTokenizerCompletion::Complete\n    ));\n\n    assert_eq!(analysis.coverage().committed_end(), 9);\n    assert_eq!(\n        analysis.coverage().processed_tokens(),\n        analysis.tokenizer_run().tokens().len()\n    );\n    assert!(analysis.is_complete());\n\n    let g8 = gold_cases()\n        .into_iter()\n        .find(|case| case.id == \"G8\")\n        .expect(\"historical G8 remains frozen\");\n    assert_eq!(g8.committed_prefix_end, 6);\n    assert_eq!(\n        g8.completion,\n        GoldCompletion::IncompleteUnsupported((6, 9))\n    );\n}\n""",
          )

          replace(
              validation,
              """fn g10_structural_bounds_hold_without_any_tree_resource_limit() {\n    for case in gold_cases() {\n""",
              """fn g10_structural_bounds_hold_without_any_tree_resource_limit() {\n    for case in production_correspondence_cases() {\n""",
          )

          replace(
              validation,
              """        \"<head></head><body>\",\n        \"<body><p>\",\n        \"<p>\",\n""",
              """        \"<head></head><body>\",\n        \"<p>\",\n""",
          )

          replace(
              validation,
              """        (\"<body><p>\", HtmlTreeCapability::NonShellElementTag),\n        (\"</p>\", HtmlTreeCapability::NonShellElementTag),\n""",
              """        (\"<body><span>\", HtmlTreeCapability::NonShellElementTag),\n        (\"</p>\", HtmlTreeCapability::ParagraphTagOutsideInBody),\n""",
          )

          replace(
              validation,
              """#[test]\nfn admission_refuses_unproved_token_shapes_before_any_mode_runs() {\n    let source = SourceText::new(SourceId::new(1), \"<p><body a><body/>\".to_owned());\n    let run = crate::html::tokenizer::producer::tokenize(&source, generous_limits());\n    let expected = [\n        HtmlTreeCapability::NonShellElementTag,\n        HtmlTreeCapability::ShellTagAttribute,\n        HtmlTreeCapability::SelfClosingShellTag,\n    ];\n    for (token, expected) in run.tokens().iter().zip(expected) {\n        assert_eq!(admit(token).err(), Some(expected));\n    }\n}\n""",
              """#[test]\nfn admission_refuses_unproved_shapes_but_recognizes_the_tc_s5_p_token() {\n    let source = SourceText::new(SourceId::new(1), \"<p><body a><body/>\".to_owned());\n    let run = crate::html::tokenizer::producer::tokenize(&source, generous_limits());\n    assert!(\n        admit(&run.tokens()[0]).is_ok(),\n        \"TC-S5 recognizes a plain p token before insertion-mode ownership is checked\"\n    );\n    let expected = [\n        HtmlTreeCapability::ShellTagAttribute,\n        HtmlTreeCapability::SelfClosingShellTag,\n    ];\n    for (token, expected) in run.tokens()[1..].iter().zip(expected) {\n        assert_eq!(admit(token).err(), Some(expected));\n    }\n}\n""",
          )

          replace(
              tc_s3,
              """// ---------------------------------------------------------------------------\n// DV11 - `<p>` remains unsupported\n// ---------------------------------------------------------------------------\n\n#[test]\nfn dv11_p_remains_unsupported() {\n    // `<body><p>`\n    //  0     6   9\n    check(&ExpectedRun {\n        id: \"DV11\",\n        source: \"<body><p>\",\n        tree: shell_with_authored_body(vec![]),\n        actions: shell_prelude_actions(),\n        diagnostics: vec![missing_doctype_at(0, (0, 6))],\n        closures: vec![],\n        node_count: 4,\n        committed_end: 6,\n        processed_tokens: 1,\n        completion: ExpectedCompletion::Unsupported {\n            capability: HtmlTreeCapability::NonShellElementTag,\n            token: 1,\n            trigger: Some((6, 9)),\n        },\n    });\n}\n""",
              """// ---------------------------------------------------------------------------\n// DV11 - historical TC-S3 P boundary, superseded by TC-S5 production\n// ---------------------------------------------------------------------------\n\n#[test]\nfn dv11_historical_p_boundary_is_now_owned_by_tc_s5_without_widening_selected_domain() {\n    let analysis = analyze(\"<body><p>\");\n    assert!(analysis.is_complete());\n    assert_eq!(analysis.node_count(), 5);\n    assert_eq!(analysis.coverage().committed_end(), 9);\n\n    let paragraph = analysis\n        .nodes_in_creation_order()\n        .into_iter()\n        .find(|node| matches!(node.kind(), HtmlTreeNodeKind::Element(HtmlElement::Paragraph(_))))\n        .expect(\"TC-S5 constructs the authored P\");\n    let Some(HtmlAuthoredSource::StartTag { complete, raw_name }) = paragraph.authored_source() else {\n        panic!(\"the authored P keeps its own source evidence\")\n    };\n    assert_eq!(span(complete), (6, 9));\n    assert_eq!(span(raw_name), (7, 8));\n    assert_eq!(\n        analysis\n            .nodes_in_creation_order()\n            .into_iter()\n            .filter(|node| matches!(\n                node.kind(),\n                HtmlTreeNodeKind::Element(HtmlElement::SelectedOrdinary(_))\n            ))\n            .count(),\n        0,\n        \"TC-S5 P support does not widen the selected ordinary div/section domain\"\n    );\n    assert_eq!(\n        project_diagnostics(&analysis),\n        vec![missing_doctype_at(0, (0, 6))]\n    );\n    assert!(analysis.actions().iter().any(|action| matches!(\n        action.kind(),\n        HtmlTreeActionKind::InsertedAuthoredParagraphElement { .. }\n    )));\n}\n""",
          )

          replace(
              tc_s3,
              """        // Names outside both closed domains stay unproved.\n        (\"<body><p>\", HtmlTreeCapability::NonShellElementTag),\n        (\"<body><div><p>\", HtmlTreeCapability::NonShellElementTag),\n        (\"<body><span>\", HtmlTreeCapability::NonShellElementTag),\n""",
              """        // Non-P names outside the selected-ordinary and Paragraph domains stay unproved.\n        (\"<body><span>\", HtmlTreeCapability::NonShellElementTag),\n""",
          )

          replace(
              tc_s3,
              """        // Frozen predecessor meanings.\n        (\"<body><p>\", HtmlTreeCapability::NonShellElementTag),\n        (\"</p>\", HtmlTreeCapability::NonShellElementTag),\n        (\"<body a>\", HtmlTreeCapability::ShellTagAttribute),\n""",
              """        // Frozen non-P predecessor meaning.\n        (\"<body><span>\", HtmlTreeCapability::NonShellElementTag),\n        // TC-S5 recognizes P, but P outside actual InBody is still a transactional refusal.\n        (\"</p>\", HtmlTreeCapability::ParagraphTagOutsideInBody),\n        (\"<body a>\", HtmlTreeCapability::ShellTagAttribute),\n""",
          )

          replace(
              tc_s4,
              """        // Names outside both closed domains keep the frozen predecessor\n        // meaning: the selected domain grew by exactly one member.\n        (\"<body><p>\", HtmlTreeCapability::NonShellElementTag),\n        (\"<body><span>\", HtmlTreeCapability::NonShellElementTag),\n""",
              """        // Non-P names outside the selected-ordinary and Paragraph domains\n        // keep the frozen unproved-name meaning.\n        (\"<body><span>\", HtmlTreeCapability::NonShellElementTag),\n""",
          )

          replace(
              tc_s4,
              """#[test]\nfn the_selected_domain_is_closed_at_div_and_section() {\n    // Anything that merely looks like a block element stays outside.\n    for name in [\n        \"p\", \"span\", \"article\", \"aside\", \"main\", \"nav\", \"header\", \"footer\", \"sections\", \"divs\",\n        \"sec\", \"SECTIONS\",\n    ] {\n        let source = format!(\"<body><{name}>\");\n        let analysis = analyze_with(&source, 1);\n        let HtmlTreeCompletion::Incomplete(HtmlTreeIncompleteCause::UnsupportedCapability(\n            unsupported,\n        )) = analysis.completion()\n        else {\n            panic!(\"{source:?}: expected explicit tree-unsupported evidence\");\n        };\n        assert_eq!(\n            unsupported.capability(),\n            HtmlTreeCapability::NonShellElementTag,\n            \"{source:?}\"\n        );\n    }\n}\n""",
              """#[test]\nfn the_selected_domain_is_closed_at_div_and_section() {\n    // Anything outside the dedicated Paragraph successor that merely looks\n    // like a block element stays outside the selected ordinary domain.\n    for name in [\n        \"span\", \"article\", \"aside\", \"main\", \"nav\", \"header\", \"footer\", \"sections\", \"divs\",\n        \"sec\", \"SECTIONS\",\n    ] {\n        let source = format!(\"<body><{name}>\");\n        let analysis = analyze_with(&source, 1);\n        let HtmlTreeCompletion::Incomplete(HtmlTreeIncompleteCause::UnsupportedCapability(\n            unsupported,\n        )) = analysis.completion()\n        else {\n            panic!(\"{source:?}: expected explicit tree-unsupported evidence\");\n        };\n        assert_eq!(\n            unsupported.capability(),\n            HtmlTreeCapability::NonShellElementTag,\n            \"{source:?}\"\n        );\n    }\n\n    let paragraph = analyze(\"<body><p>\");\n    assert!(paragraph.is_complete());\n    assert!(paragraph.nodes_in_creation_order().into_iter().any(|node| matches!(\n        node.kind(),\n        HtmlTreeNodeKind::Element(HtmlElement::Paragraph(_))\n    )));\n    assert_eq!(\n        paragraph\n            .nodes_in_creation_order()\n            .into_iter()\n            .filter(|node| matches!(\n                node.kind(),\n                HtmlTreeNodeKind::Element(HtmlElement::SelectedOrdinary(_))\n            ))\n            .count(),\n        0,\n        \"Paragraph support is a separate domain, not a third selected-ordinary name\"\n    );\n}\n""",
          )

          allowed = {validation, tc_s3, tc_s4}
          changed = {str(p) for p in Path("crates").rglob("*.rs") if False}
          print("patch applied")
          PY

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format and validate exact local delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          state="$(python3 .github/scripts/validate-rust-workspace-state.py .)"
          test "$state" = production
          git diff --name-only | sort > /tmp/actual-paths
          printf '%s\n' \
            crates/frontend-analysis-core/src/html/tree_construction/in_body_div_section_successor_production.rs \
            crates/frontend-analysis-core/src/html/tree_construction/in_body_div_successor_production.rs \
            crates/frontend-analysis-core/src/html/tree_construction/validation.rs \
            | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Full tests
        run: cargo test --workspace --all-targets --all-features

      - name: Commit and push only after green validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yuto"
          git config user.email "msc_prop@proton.me"
          git add \
            crates/frontend-analysis-core/src/html/tree_construction/validation.rs \
            crates/frontend-analysis-core/src/html/tree_construction/in_body_div_successor_production.rs \
            crates/frontend-analysis-core/src/html/tree_construction/in_body_div_section_successor_production.rs
          git commit -m "test(html): align predecessor production checks with TC-S5 frontier"
          git push origin HEAD:feat/html-tc-s5-p-production
