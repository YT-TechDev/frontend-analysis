name: Temporary Unicode Bidi 491

on:
  push:
    branches:
      - feat/css-unicode-bidi-value-qualification

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/css-unicode-bidi-value-qualification
          fetch-depth: 0
      - name: Apply exact production patch once
        run: |
          if grep -q "CssUnicodeBidiValue" crates/frontend-analysis-core/src/css/value_qualification.rs; then
            echo "production patch already present"
          else
            python .github/tmp-unicode-bidi-491.py
          fi
      - name: Format
        run: cargo fmt --all
      - name: Focused unicode-bidi tests
        run: cargo test --workspace --all-targets --all-features css::validation::unicode_bidi_value_qualification_tests
      - name: Diff check
        run: git diff --check
      - name: Commit validated candidate if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/frontend-analysis-core/src/css/value_qualification.rs \
                  crates/frontend-analysis-core/src/css/validation/unicode_bidi_value_qualification_tests.rs \
                  crates/frontend-analysis-core/src/css/validation/mod.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no candidate changes to commit"
            exit 0
          fi
          git commit -m "feat(css): add bounded unicode-bidi qualification"
          git push origin HEAD:feat/css-unicode-bidi-value-qualification
