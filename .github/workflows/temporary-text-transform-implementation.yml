name: Temporary text-transform implementation

on:
  push:
    branches:
      - feat/css-text-transform-value-qualification
    paths:
      - .github/workflows/temporary-text-transform-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Select accepted Rust toolchain
        run: rustup override set 1.97.1

      - name: Apply bounded text-transform leaf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("crates/frontend-analysis-core/src/css/value_qualification.rs")
          source = source_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              "#534/#536/#538/#541).",
              "#534/#536/#538/#541/#546).",
              "module provenance",
          )

          type_anchor = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum CssOverscrollBehaviorXValue"
          type_block = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextTransformComponent {
              Capitalize,
              Uppercase,
              Lowercase,
              FullWidth,
              FullSizeKana,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssTextTransformComponents {
              authored: [CssTextTransformComponent; 3],
              count: usize,
          }

          impl CssTextTransformComponents {
              pub(crate) fn authored_components(&self) -> &[CssTextTransformComponent] {
                  &self.authored[..self.count]
              }
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextTransformValue {
              None,
              MathAuto,
              Components(CssTextTransformComponents),
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextTransformUnsupportedReason {
              CssWideKeyword,
              DeferredSubstitutionFunction,
              WholeValueFunction,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum CssTextTransformQualificationOutcome {
              Qualified(CssTextTransformValue),
              InvalidForSelectedValueGrammar,
              UnsupportedBySelectedValueProfile(CssTextTransformUnsupportedReason),
          }

          /// One selected ordinary declaration's bounded authored
          /// `text-transform` qualification.
          ///
          /// Composite values preserve exact authored component order even though CSS
          /// `||` matching is order-insensitive. The CASE slot is mutually exclusive,
          /// while `full-width` and `full-size-kana` each claim their own singleton
          /// slot. `none` and `math-auto` remain standalone authored identities. This
          /// slice does not transform text, perform language-sensitive casing, map
          /// width/kana/math characters, canonicalize CSSOM order, or claim
          /// computed/used-value semantics.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) struct CssTextTransformQualificationObservation {
              occurrence_index: usize,
              placement: CssDeclarationPlacement,
              outcome: CssTextTransformQualificationOutcome,
          }

          impl CssTextTransformQualificationObservation {
              pub(crate) const fn occurrence_index(&self) -> usize {
                  self.occurrence_index
              }

              pub(crate) const fn placement(&self) -> CssDeclarationPlacement {
                  self.placement
              }

              pub(crate) const fn outcome(&self) -> CssTextTransformQualificationOutcome {
                  self.outcome
              }
          }

          '''
          source = replace_once(source, type_anchor, type_block + type_anchor, "type insertion")

          field_anchor = "    text_decoration_line_observations: Vec<CssTextDecorationLineQualificationObservation>,\n"
          source = replace_once(
              source,
              field_anchor,
              field_anchor
              + "    text_transform_observations: Vec<CssTextTransformQualificationObservation>,\n",
              "run-result field",
          )

          getter_anchor = "    pub(crate) fn overscroll_behavior_x_observations(\n"
          getter = '''    pub(crate) fn text_transform_observations(
              &self,
          ) -> &[CssTextTransformQualificationObservation] {
              &self.text_transform_observations
          }

          '''
          source = replace_once(source, getter_anchor, getter + getter_anchor, "getter insertion")

          mut_anchor = "        let mut text_decoration_line_observations = Vec::new();\n"
          source = replace_once(
              source,
              mut_anchor,
              mut_anchor + "        let mut text_transform_observations = Vec::new();\n",
              "mutable collection",
          )

          for indent, expected in (("        ", 2), ("            ", 1)):
              old = (
                  f"{indent}text_decoration_line_observations,\n"
                  f"{indent}overscroll_behavior_x_observations,"
              )
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"tuple/constructor adjacency at indent {len(indent)}: "
                      f"expected {expected}, found {count}"
                  )
              new = (
                  f"{indent}text_decoration_line_observations,\n"
                  f"{indent}text_transform_observations,\n"
                  f"{indent}overscroll_behavior_x_observations,"
              )
              source = source.replace(old, new)

          dispatch_anchor = '            if property_name.eq_ignore_ascii_case("overscroll-behavior-x") {\n'
          dispatch = '''            if property_name.eq_ignore_ascii_case("text-transform") {
              let value_range = cursor.window_for(occurrence.value())?;
              let value_items = &tokenizer_result.lexical_items()[value_range];
              text_transform_observations.push(CssTextTransformQualificationObservation {
                  occurrence_index,
                  placement: occurrence.placement(),
                  outcome: qualify_text_transform_value(value_items),
              });
              continue;
          }

          '''
          source = replace_once(source, dispatch_anchor, dispatch + dispatch_anchor, "dispatch insertion")

          qualifier_anchor = "fn qualify_overscroll_behavior_value(\n"
          qualifier = '''fn qualify_text_transform_value(
              items: &[CssLexicalItem],
          ) -> CssTextTransformQualificationOutcome {
              if contains_deferred_substitution_function(items) {
                  return CssTextTransformQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssTextTransformUnsupportedReason::DeferredSubstitutionFunction,
                  );
              }

              if is_entire_whole_value_function(items) {
                  return CssTextTransformQualificationOutcome::UnsupportedBySelectedValueProfile(
                      CssTextTransformUnsupportedReason::WholeValueFunction,
                  );
              }

              let tokens: Vec<_> = items
                  .iter()
                  .filter_map(|item| match item {
                      CssLexicalItem::SemanticToken(token)
                          if !matches!(token.kind(), CssTokenKind::Whitespace) =>
                      {
                          Some(token)
                      }
                      _ => None,
                  })
                  .collect();

              if let [token] = tokens.as_slice()
                  && let CssTokenKind::Ident(identifier) = token.kind()
              {
                  if is_css_wide_keyword(identifier) {
                      return CssTextTransformQualificationOutcome::UnsupportedBySelectedValueProfile(
                          CssTextTransformUnsupportedReason::CssWideKeyword,
                      );
                  }
                  if identifier.eq_ignore_ascii_case("none") {
                      return CssTextTransformQualificationOutcome::Qualified(
                          CssTextTransformValue::None,
                      );
                  }
                  if identifier.eq_ignore_ascii_case("math-auto") {
                      return CssTextTransformQualificationOutcome::Qualified(
                          CssTextTransformValue::MathAuto,
                      );
                  }
              }

              if tokens.is_empty() || tokens.len() > 3 {
                  return CssTextTransformQualificationOutcome::InvalidForSelectedValueGrammar;
              }

              let mut authored = [CssTextTransformComponent::Capitalize; 3];
              let mut count = 0usize;
              let mut occupied_slots = 0u8;

              for token in tokens {
                  let CssTokenKind::Ident(identifier) = token.kind() else {
                      return CssTextTransformQualificationOutcome::InvalidForSelectedValueGrammar;
                  };
                  let Some((component, slot)) = text_transform_component(identifier) else {
                      return CssTextTransformQualificationOutcome::InvalidForSelectedValueGrammar;
                  };
                  if occupied_slots & slot != 0 {
                      return CssTextTransformQualificationOutcome::InvalidForSelectedValueGrammar;
                  }
                  occupied_slots |= slot;
                  authored[count] = component;
                  count += 1;
              }

              CssTextTransformQualificationOutcome::Qualified(CssTextTransformValue::Components(
                  CssTextTransformComponents { authored, count },
              ))
          }

          fn text_transform_component(identifier: &str) -> Option<(CssTextTransformComponent, u8)> {
              if identifier.eq_ignore_ascii_case("capitalize") {
                  return Some((CssTextTransformComponent::Capitalize, 0b001));
              }
              if identifier.eq_ignore_ascii_case("uppercase") {
                  return Some((CssTextTransformComponent::Uppercase, 0b001));
              }
              if identifier.eq_ignore_ascii_case("lowercase") {
                  return Some((CssTextTransformComponent::Lowercase, 0b001));
              }
              if identifier.eq_ignore_ascii_case("full-width") {
                  return Some((CssTextTransformComponent::FullWidth, 0b010));
              }
              if identifier.eq_ignore_ascii_case("full-size-kana") {
                  return Some((CssTextTransformComponent::FullSizeKana, 0b100));
              }
              None
          }

          '''
          source = replace_once(
              source,
              qualifier_anchor,
              qualifier + qualifier_anchor,
              "qualifier insertion",
          )

          source_path.write_text(source)

          mod_path = Path("crates/frontend-analysis-core/src/css/validation/mod.rs")
          mod_text = mod_path.read_text()
          mod_anchor = "#[cfg(test)]\nmod text_underline_offset_value_qualification_tests;\n"
          mod_insert = "#[cfg(test)]\nmod text_transform_value_qualification_tests;\n"
          mod_text = replace_once(
              mod_text,
              mod_anchor,
              mod_insert + mod_anchor,
              "test module registration",
          )
          mod_path.write_text(mod_text)
          PY

      - name: Format candidate
        run: cargo fmt --all

      - name: Validate patch cleanliness
        run: git diff --check

      - name: Run focused text-transform tests
        run: cargo test -p frontend-analysis-core text_transform_value_qualification_tests

      - name: Run Core Clippy
        run: cargo clippy -p frontend-analysis-core --all-targets -- -D warnings

      - name: Run Core full suite
        run: cargo test -p frontend-analysis-core

      - name: Commit sealed candidate and remove transport workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-text-transform-implementation.yml
          git add \
            crates/frontend-analysis-core/src/css/value_qualification.rs \
            crates/frontend-analysis-core/src/css/validation/mod.rs \
            crates/frontend-analysis-core/src/css/validation/text_transform_value_qualification_tests.rs
          git diff --cached --check
          git commit -m "feat(css): add bounded text-transform value qualification"
          git push origin HEAD:feat/css-text-transform-value-qualification
