name: TC-S8 validation gate v2

on:
  push:
    branches:
      - tooling/tc-s8-validation-gate-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: test/380-tc-s8-validation
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact feature head
        run: |
          test "$(git rev-parse HEAD)" = "51ca3efe38fd9f4aea6582fa8d1b5fd53eda1eef"
          test "$(git merge-base 024e0e62520d1c7e298605eb4539434ef6c8d5e7 HEAD)" = "024e0e62520d1c7e298605eb4539434ef6c8d5e7"

      - name: Apply evidence strengthening
        run: python3 .github/tc-s8-strengthen.py

      - name: Install Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo +1.97.1 fmt --all

      - name: Exact two-path theorem
        run: |
          actual="$(git diff --name-only 024e0e62520d1c7e298605eb4539434ef6c8d5e7 | sort)"
          expected="$(printf '%s\n' crates/frontend-analysis-core/src/html/tree_construction/in_body_html_end_open_stack_successor_validation.rs crates/frontend-analysis-core/src/html/tree_construction/mod.rs | sort)"
          test "$actual" = "$expected"

      - name: Workspace policy
        run: test "$(python3 .github/scripts/validate-rust-workspace-state.py .)" = production

      - name: Rustfmt check
        run: cargo +1.97.1 fmt --all -- --check

      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Focused validation
        run: cargo +1.97.1 test -p frontend-analysis-core html::tree_construction::in_body_html_end_open_stack_successor_validation

      - name: Tree-construction validation
        run: cargo +1.97.1 test -p frontend-analysis-core html::tree_construction

      - name: Full workspace
        run: cargo +1.97.1 test --workspace --all-targets --all-features

      - name: Locked metadata
        run: cargo +1.97.1 metadata --offline --format-version 1 --locked

      - name: Diff hygiene
        run: git diff --check

      - name: Publish only after green
        run: |
          git config user.name "YT-TechDev"
          git config user.email "msc_prop@proton.me"
          git add crates/frontend-analysis-core/src/html/tree_construction/in_body_html_end_open_stack_successor_validation.rs
          git commit -m "test(html): strengthen TC-S8 validation evidence"
          git push origin HEAD:test/380-tc-s8-validation
