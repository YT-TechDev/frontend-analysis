name: Temporary #171 Docs Validation

on:
  push:
    branches:
      - feat/css-keyframes-contexts-171-clean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Align context documentation with #170/#171 capabilities
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("crates/frontend-analysis-core/src/css/parser/context.rs"); t=p.read_text(); old="//! [`CssParserContextKind`] now also carries `GroupRuleBlock`, the finite\n//! nested `@media`/`@supports`/`@container`/`@layer`/`@scope` registry\n//! approved for #168, and `DescriptorRuleBlock`, the finite stylesheet-root-\n//! only `@font-face`/`@property` registry approved for #169; page (#170) and\n//! keyframe (#171) context meanings remain deliberately absent rather than\n//! pre-populated speculatively. Context nesting depth"; new="//! [`CssParserContextKind`] now also carries `GroupRuleBlock`, the finite\n//! nested `@media`/`@supports`/`@container`/`@layer`/`@scope` registry\n//! approved for #168, `DescriptorRuleBlock` for the finite stylesheet-root-\n//! only `@font-face`/`@property` registry approved for #169, Page/PageMargin\n//! contexts from #170, and root-owned Keyframes/KeyframeBlock contexts from\n//! #171. Context nesting depth"; assert t.count(old)==1; t=t.replace(old,new); old="/// descriptor-block flag/plugin vocabulary. Later approved Leaves extend this\n/// enum explicitly (#170 page/page-margin contexts, #171 keyframe contexts);\n/// this Leaf does not pre-populate them."; new="/// descriptor-block flag/plugin vocabulary. #170 and #171 extend this enum\n/// explicitly with Page/PageMargin and root-owned Keyframes/KeyframeBlock\n/// contexts; no generic special-rule registry is introduced."; assert t.count(old)==1; p.write_text(t.replace(old,new))'
          git diff --check

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Full tests
        run: cargo test --workspace --all-targets --all-features

      - name: Locked metadata
        run: cargo metadata --offline --format-version 1 --locked

      - name: Commit validated documentation alignment
        shell: bash
        run: |
          git rm .github/workflows/_docs-171.yml
          git add crates/frontend-analysis-core/src/css/parser/context.rs
          git diff --cached --check
          git config user.name "YT-TechDev"
          git config user.email "271404462+YT-TechDev@users.noreply.github.com"
          git commit -m "docs(core): align CSS context capability notes (#171)"
          git push origin HEAD:feat/css-keyframes-contexts-171-clean
