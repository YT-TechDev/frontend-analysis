name: TC-S8 validation gate

on:
  push:
    branches:
      - tooling/tc-s8-validation-gate

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: test/380-tc-s8-validation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact starting head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "ad81b430eae921b11cacb3ff4ddfeb7ffa84ce4b"
          test "$(git merge-base 024e0e62520d1c7e298605eb4539434ef6c8d5e7 HEAD)" = "024e0e62520d1c7e298605eb4539434ef6c8d5e7"

      - name: Install accepted Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Format candidate
        run: cargo fmt --all

      - name: Verify exact two-path theorem
        shell: bash
        run: |
          actual="$(git diff --name-only 024e0e62520d1c7e298605eb4539434ef6c8d5e7 | sort)"
          expected="$(printf '%s\n' \
            crates/frontend-analysis-core/src/html/tree_construction/in_body_html_end_open_stack_successor_validation.rs \
            crates/frontend-analysis-core/src/html/tree_construction/mod.rs | sort)"
          printf 'Actual paths:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Validate production workspace policy
        shell: bash
        run: |
          state="$(python3 .github/scripts/validate-rust-workspace-state.py .)"
          test "$state" = production

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Validate Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run focused TC-S8 validation
        run: cargo test -p frontend-analysis-core html::tree_construction::in_body_html_end_open_stack_successor_validation

      - name: Run tree-construction tests
        run: cargo test -p frontend-analysis-core html::tree_construction

      - name: Run full workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Validate locked metadata
        run: cargo metadata --offline --format-version 1 --locked

      - name: Validate diff hygiene
        run: git diff --check

      - name: Publish formatting-only normalization if needed
        shell: bash
        run: |
          if test -n "$(git status --short)"; then
            changed="$(git diff --name-only | sort)"
            test "$changed" = "crates/frontend-analysis-core/src/html/tree_construction/in_body_html_end_open_stack_successor_validation.rs"
            git config user.name "YT-TechDev"
            git config user.email "msc_prop@proton.me"
            git add crates/frontend-analysis-core/src/html/tree_construction/in_body_html_end_open_stack_successor_validation.rs
            git commit -m "style(html): format TC-S8 validation"
            git push origin HEAD:test/380-tc-s8-validation
          fi
