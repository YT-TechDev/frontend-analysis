name: Bug report
description: Report reproducible incorrect behavior that is not a security vulnerability.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a reproducible defect.

        Review the [contributor workflow](https://github.com/YT-TechDev/frontend-analysis/blob/main/.github/CONTRIBUTING.md) before submitting. Security vulnerabilities must not be reported publicly; follow the private process in the [Security Policy](https://github.com/YT-TechDev/frontend-analysis/security/policy). Redact secrets, credentials, private source data, and sensitive browser or environment information.

  - type: checkboxes
    id: security_gate
    attributes:
      label: Security gate
      options:
        - label: I reviewed the Security Policy, and this public Issue does not contain a suspected vulnerability or active vulnerability details.
          required: true
    validations:
      required: true

  - type: textarea
    id: problem_summary
    attributes:
      label: Problem summary
      description: Concisely describe the incorrect behavior and why it matters.
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What currently happens?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide deterministic steps, a minimal example, or the smallest available evidence. Redact sensitive values and private source data.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: environment_context
    attributes:
      label: Environment and context
      description: Include only relevant details, such as the operating system, tool or commit version, browser engine or adapter when applicable, input format, and minimal environment details.

  - type: textarea
    id: affected_boundary
    attributes:
      label: Affected boundary
      description: Which layer, module, contract, adapter, or documentation area appears affected, if known? Enter `Unknown` when uncertain; you do not need to decide the architecture.
    validations:
      required: true

  - type: textarea
    id: evidence_validation
    attributes:
      label: Evidence and validation
      description: Share relevant logs, screenshots, traces, minimized input, or checks already performed. Redact sensitive data; do not include full untrusted or private payloads by default.

  - type: checkboxes
    id: final_acknowledgements
    attributes:
      label: Final acknowledgements
      options:
        - label: I searched for an existing Issue.
          required: true
        - label: This report focuses on one coherent defect.
          required: true
        - label: I have not included credentials, private information, or active vulnerability details.
          required: true
        - label: I will follow the [Code of Conduct](https://github.com/YT-TechDev/frontend-analysis/blob/main/.github/CODE_OF_CONDUCT.md).
          required: true
    validations:
      required: true
